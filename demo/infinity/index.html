*{box-sizing:border-box}body{margin:0;background:#f6f2f7;color:#28172f;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit}.top{background:#1b0d2d;color:#fff}.topin{max-width:1180px;margin:auto;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:900;font-size:22px;text-decoration:none}.back{color:#fff;text-decoration:none;font-weight:750}.wrap{max-width:1180px;margin:26px auto;padding:0 18px}.card{background:#fff;border:1px solid #eadfed;border-radius:24px;overflow:hidden;box-shadow:0 18px 50px #2d123b14}.banner{width:100%;aspect-ratio:3/1;background:linear-gradient(115deg,#1c0b2d,#52206f 58%,#d09a43) center/cover no-repeat}.identity{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;padding:22px 28px 16px}.logo{width:96px;height:96px;border-radius:20px;background:#fff center/cover no-repeat;border:4px solid #fff;box-shadow:0 6px 20px #0002;display:grid;place-items:center;color:#6d2b88;font-weight:900;font-size:26px}.name{font-size:28px;font-weight:900;line-height:1.1}.meta{margin-top:7px;color:#716775;display:flex;gap:9px;flex-wrap:wrap;align-items:center}.badge{background:#f0e6f5;color:#5d2371;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:850}.identity-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.share,.follow,.contact-toggle{border:1px solid #6d2b88;background:#fff;color:#6d2b88;border-radius:12px;padding:10px 15px;font-weight:850;cursor:pointer}.follow{background:#6d2b88;color:#fff}.follow.following{background:#f1e7f5;color:#5d2371}.follow:disabled{opacity:.65;cursor:default}.contact-box{margin:0 28px 18px;border:1px solid #eadfed;border-radius:14px;padding:14px 16px;background:#fbf8fc;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.contact-box.hidden{display:none}.contact-box strong{margin-right:auto}.contact-link{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border:1px solid #6d2b88;border-radius:10px;padding:9px 12px;font-weight:800;color:#6d2b88;background:#fff}.tabs{display:flex;gap:4px;border-bottom:1px solid #ece4ee;padding:0 22px;overflow:auto}.tabs button{border:0;background:none;padding:14px 15px;font-weight:850;white-space:nowrap;cursor:pointer}.tabs button.active{color:#6d2b88;border-bottom:3px solid #6d2b88}.pane{padding:22px}.tools{display:grid;grid-template-columns:1fr 190px 190px;gap:10px;margin-bottom:18px}.tools input,.tools select{width:100%;min-height:44px;border:1px solid #ddd0e1;border-radius:12px;padding:0 12px;background:#fff}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.ad{display:block;text-decoration:none;border:1px solid #e9e1eb;border-radius:16px;overflow:hidden;background:#fff;transition:.15s transform,.15s box-shadow}.ad:hover{transform:translateY(-2px);box-shadow:0 10px 26px #32154116}.photo{aspect-ratio:4/3;background:#eee6f0 center/cover no-repeat}.adbody{padding:11px}.adtitle{font-weight:850;line-height:1.25;min-height:2.5em}.price{font-weight:900;color:#5b2170;margin-top:6px}.city{color:#746a77;font-size:13px;margin-top:4px}.more{display:block;margin:20px auto 0;border:0;border-radius:12px;background:#6d2b88;color:#fff;padding:11px 18px;font-weight:850;cursor:pointer}.about{display:grid;grid-template-columns:1.4fr .6fr;gap:22px}.box{border:1px solid #e9e1eb;border-radius:16px;padding:18px}.box h3{margin-top:0}.facts{display:grid;gap:12px}.fact{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid #eee7ef;padding-bottom:10px}.review{border:1px solid #e9e1eb;border-radius:16px;padding:16px;margin-bottom:12px}.stars{color:#a46b1b;font-weight:900}.muted{color:#776c7b}.empty{padding:30px;text-align:center;color:#776c7b}.error{max-width:620px;margin:80px auto;background:#fff;border-radius:20px;padding:30px;text-align:center;border:1px solid #eadfed}.error a{display:inline-block;margin-top:12px;color:#6d2b88;font-weight:850}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.tools{grid-template-columns:1fr 1fr}.tools input{grid-column:1/-1}.about{grid-template-columns:1fr}}
@media(max-width:620px){.wrap{margin:14px auto;padding:0 10px}.card{border-radius:18px}.identity{grid-template-columns:72px 1fr;padding:16px 14px 12px;gap:12px}.logo{width:72px;height:72px;border-radius:16px;font-size:20px}.name{font-size:21px}.identity .identity-actions{grid-column:1/-1;width:100%;display:grid;grid-template-columns:1fr 1fr}.identity .share,.identity .follow,.identity .contact-toggle{width:100%}.contact-box{margin:0 14px 14px}.contact-box strong{width:100%;margin:0}.tabs{padding:0 8px}.pane{padding:14px 10px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tools{grid-template-columns:1fr}.tools input{grid-column:auto}.adbody{padding:9px}.adtitle{font-size:14px}.price{font-size:15px}.topin{padding:12px}.brand{font-size:19px}}
.sortbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.sortbar .count{color:#5b4565;font-size:14px}.sortbar select{min-height:42px;min-width:170px;border:1px solid #ddd0e1;border-radius:12px;padding:0 10px;background:#fff;font-size:15px;color:#28172f}.specs{color:#5b4565;font-size:13px;margin-top:4px}.ad{cursor:default}.demo-ribbon{background:#f4eaf8;color:#6d2b88;text-align:center;font-size:13px;font-weight:800;padding:7px 14px}
</style>

<body>
<header class="top"><div class="topin"><a class="brand" href="/">Abracadeal</a><a class="back" href="/">← Retour aux annonces</a></div></header>
<div class="demo-ribbon">Aperçu préparé pour Infinity Group Immobilier · ce showroom n’est pas publié</div>
<main class="wrap"><div id="app"><div class="card"><div class="empty">Chargement du showroom…</div></div></div></main>
<script>
/* 02/11/2026 (Claude) : aperçu du futur showroom d'Infinity Group Immobilier, données lues sur leur site par le robot
   (lecture à blanc, rien de publié). Accès uniquement avec le lien secret (?k=…), via la fonction get_demo_preview. */
const app=document.getElementById('app');
const sb=window.supabase.createClient('https://jplzvxmpbpjssyinozap.supabase.co','sb_publishable_lUCkpzyw0kQCs9AWraNjzw_2CoT0JeF');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const initials=name=>String(name||'PRO').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()||'PRO';
const TYPES={'vente-appartement':'Appartement','vente-maison':'Maison','vente-terrain':'Terrain','location':'Location','bureaux-commerces':'Bureaux / Commerces','parking-garage':'Parking / Garage'};
let name='',city='',listings=[],filtered=[],shown=24,isFollowing=false,followerCount=0;
function money(l){if(l.price==null||l.price==='')return 'Prix non renseigné';const s=Number(l.price).toLocaleString('fr-FR')+' €';return l.sub==='location'?s+' / mois':s;}
function fail(){app.innerHTML='<div class="error"><h1>Aperçu indisponible</h1><p>Ce lien d’aperçu n’est pas valide ou a expiré.</p><a href="/">Découvrir Abracadeal</a></div>';}
function renderShell(){
  document.title=name+' · Showroom Abracadeal';
  const types=[...new Set(listings.map(l=>TYPES[l.sub]).filter(Boolean))];
  app.innerHTML='<div class="card"><div class="banner"></div>'+
    '<div class="identity"><div class="logo">'+esc(initials(name))+'</div>'+
    '<div><div class="name">'+esc(name)+'</div><div class="meta"><span class="badge">✓ Professionnel</span>'+(city?'<span>'+esc(city)+'</span>':'')+'<span>★ Aucun avis</span><span id="followersCount">0 abonné</span></div></div>'+
    '<div class="identity-actions"><button class="follow" id="followBtn" type="button">♡ S’abonner</button><button class="contact-toggle" type="button" id="contactBtn">Contacter</button><button class="share" id="shareBtn" type="button">Partager</button></div></div>'+
    '<nav class="tabs"><button class="active" data-tab="ads">Annonces ('+listings.length+')</button><button data-tab="about">À propos</button><button data-tab="reviews">Avis (0)</button></nav>'+
    '<section class="pane" id="pane"></section></div>';
  document.getElementById('shareBtn').onclick=()=>{document.getElementById('shareBtn').textContent='Disponible une fois en ligne'};
  document.getElementById('contactBtn').onclick=()=>{document.getElementById('contactBtn').textContent='Disponible une fois en ligne'};
  document.getElementById('followBtn').onclick=()=>{const b=document.getElementById('followBtn');isFollowing=!isFollowing;followerCount=isFollowing?1:0;b.classList.toggle('following',isFollowing);b.textContent=isFollowing?'✓ Abonné':'♡ S’abonner';document.getElementById('followersCount').textContent=followerCount+' abonné';};
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
  window.__types=types;setTab('ads');
}
function setTab(tab){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  const pane=document.getElementById('pane');
  if(tab==='ads'){
    pane.innerHTML='<div class="sortbar"><div class="count"><b>'+listings.length+'</b> biens</div><select id="stockSort" aria-label="Trier par prix"><option value="">Trier par prix</option><option value="asc">Prix croissant</option><option value="desc">Prix décroissant</option></select></div><div id="stockResults"></div>';
    document.getElementById('stockSort').onchange=e=>{const v=e.target.value;filtered=[...listings];if(v)filtered.sort((a,b)=>v==='asc'?(a.price??Infinity)-(b.price??Infinity):(b.price??-1)-(a.price??-1));shown=24;renderCards();};
    filtered=[...listings];shown=24;renderCards();
  }else if(tab==='about'){
    pane.innerHTML='<div class="about"><div class="box"><h3>À propos</h3><p>Agence immobilière au Cannet. '+esc((window.__types||[]).join(', '))+' sur la Côte d’Azur.</p><p class="muted">La présentation de l’agence, son logo et sa bannière s’affichent ici une fois la page activée.</p></div><div class="box"><h3>Informations</h3><div class="facts"><div class="fact"><span>Ville</span><strong>'+esc(city||'—')+'</strong></div><div class="fact"><span>Annonces</span><strong>'+listings.length+'</strong></div></div></div></div>';
  }else pane.innerHTML='<div class="empty">Aucun avis pour le moment.</div>';
}
function renderCards(){
  const host=document.getElementById('stockResults');if(!host)return;
  const cards=filtered.slice(0,shown).map(l=>{
    const specs=[TYPES[l.sub]||'',l.surface?Math.round(l.surface)+' m²':'',l.rooms?l.rooms+' pièce'+(l.rooms>1?'s':''):''].filter(Boolean).join(' · ');
    return '<div class="ad"><div class="photo"'+(l.photo?' style="background-image:url(&quot;'+esc(l.photo)+'&quot;)"':'')+'></div><div class="adbody"><div class="adtitle">'+esc(l.title)+'</div><div class="price">'+esc(money(l))+'</div>'+(specs?'<div class="specs">'+esc(specs)+'</div>':'')+'<div class="city">'+esc(l.city||'')+'</div></div></div>';
  }).join('');
  host.innerHTML='<div class="grid">'+cards+'</div>'+(shown<filtered.length?'<button class="more" id="moreBtn" type="button">Voir plus</button>':'');
  document.getElementById('moreBtn')?.addEventListener('click',()=>{shown+=24;renderCards()});
}
(async()=>{
  const k=new URLSearchParams(location.search).get('k')||'';
  if(!k){fail();return}
  const {data,error}=await sb.rpc('get_demo_preview',{p_token:k});
  if(error||!data){fail();return}
  name=data.name;city=data.city||'';
  listings=(data.rows||[]).map(r=>({title:r.t||'Bien immobilier',price:r.p,city:r.c||'',surface:r.s,rooms:r.r,sub:r.sub||'',photo:r.ph||''}));
  renderShell();
})().catch(fail);
</script>
<script src="/assets/app-shell-20261018.js?v=8" defer></script>
</body>
