<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photos du logement — Abracadeal Hôte</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f8f4fa;--card:#fff;--ink:#21132d;--muted:#77677f;--line:#e8dced;--p:#6f218c;--pink:#e746a3;--bad:#b4234f;--shadow:0 18px 45px rgba(47,17,63,.09)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}a{text-decoration:none;color:inherit}button,input,select{font:inherit}.top{background:#1c0b2b;color:#fff}.topin{width:min(980px,calc(100% - 28px));margin:auto;min-height:68px;display:flex;justify-content:space-between;align-items:center}.wrap{width:min(980px,calc(100% - 28px));margin:28px auto 60px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow);margin-top:16px}.muted{color:var(--muted)}.btn{border:0;border-radius:12px;min-height:42px;padding:0 13px;font-weight:850;cursor:pointer;transition:transform .2s ease,box-shadow .2s ease}.btn:hover{transform:translateY(-1px)}.primary{background:linear-gradient(135deg,#842aaa,var(--pink));color:#fff;box-shadow:0 10px 24px rgba(132,42,170,.22)}.soft{background:#f3eaf6;color:var(--p)}.danger{background:#fff0f3;color:var(--bad)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.photo{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}.photo img{width:100%;height:200px;object-fit:cover;display:block}.photoBody{padding:12px}.actions{display:flex;gap:7px;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:7px}.field select,.field input{border:1px solid var(--line);border-radius:12px;padding:11px}.pill{display:inline-flex;padding:6px 9px;border-radius:999px;background:#f1e7f5;color:var(--p);font-size:.75rem;font-weight:850}.hidden{display:none!important}.notice{padding:11px 12px;border-radius:12px;background:#f3eaf6;color:#602777;margin-top:12px}.empty{border:1px dashed #d8c9df;border-radius:16px;padding:25px;text-align:center;color:var(--muted)}
@media(max-width:720px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid{grid-template-columns:1fr}}
</style><link rel="stylesheet" href="assets/mobile-safety-20260919.css?v=20260919-1">
</head><body>
<header class="top"><div class="topin"><b>Abracadeal Hôte · Photos</b><a href="espace-hote.html">← Espace Hôte</a></div></header>
<main class="wrap">
<div class="card">
  <div style="display:flex;justify-content:space-between;gap:12px;align-items:end;flex-wrap:wrap">
    <div><span class="pill">Galerie</span><h1 id="title">Photos du logement</h1><p class="muted">La première photo devient la photo principale. Jusqu’à 20 photos par logement Vacances.</p></div>
    <div class="field"><label>Logement</label><select id="listing"></select></div>
  </div>
  <div class="field" style="margin-top:16px"><label>Ajouter des photos</label><input id="files" type="file" accept="image/jpeg,image/png,image/webp" multiple></div>
  <div class="actions" style="margin-top:12px"><button id="uploadBtn" class="btn primary">Importer les photos</button><button id="publishBtn" class="btn primary">Terminer et publier</button></div>
  <div id="notice" class="notice hidden"></div>
</div>
<div class="card"><div id="photos" class="grid"></div></div>
</main>
<script>
const SUPABASE_URL='https://jplzvxmpbpjssyinozap.supabase.co',SUPABASE_KEY='sb_publishable_lUCkpzyw0kQCs9AWraNjzw_2CoT0JeF';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),$=id=>document.getElementById(id);let user=null,listings=[],photos=[];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function note(t){$('notice').textContent=t;$('notice').classList.remove('hidden')}
async function boot(){const {data:{user:u}}=await sb.auth.getUser();if(!u){location.href='espace-hote.html';return}user=u;const {data,error}=await sb.from('listings').select('id,title').eq('owner_id',user.id).eq('category','vacances').order('created_at',{ascending:false});if(error){note(error.message);return}listings=data||[];$('listing').innerHTML=listings.length?listings.map(x=>'<option value="'+x.id+'">'+esc(x.title)+'</option>').join(''):'<option value="">Aucun logement</option>';const q=new URLSearchParams(location.search).get('listing');if(q&&listings.some(x=>x.id===q))$('listing').value=q;await load()}
async function load(){const id=$('listing').value;if(!id){$('photos').innerHTML='<div class="empty">Ajoutez d’abord un logement.</div>';return}const l=listings.find(x=>x.id===id);$('title').textContent='Photos · '+(l?.title||'Logement');const {data,error}=await sb.from('listing_photos').select('*').eq('listing_id',id).order('position').order('created_at');if(error){note(error.message);return}photos=data||[];render()}
function render(){$('photos').innerHTML=photos.length?photos.map((p,i)=>{const url=sb.storage.from('listing-images').getPublicUrl(p.storage_path).data.publicUrl;return '<div class="photo"><img src="'+url+'" alt=""><div class="photoBody"><div style="margin-bottom:8px">'+(i===0?'<span class="pill">Photo principale</span>':'Photo '+(i+1))+'</div><div class="actions"><button class="btn soft" onclick="movePhoto(\''+p.id+'\',-1)" '+(i===0?'disabled':'')+'>←</button><button class="btn soft" onclick="movePhoto(\''+p.id+'\',1)" '+(i===photos.length-1?'disabled':'')+'>→</button><button class="btn danger" onclick="deletePhoto(\''+p.id+'\')">Supprimer</button></div></div></div>'}).join(''):'<div class="empty">Aucune photo. Ajoutez au moins une belle photo principale.</div>'}
$('listing').onchange=load;
$('uploadBtn').onclick=async()=>{const id=$('listing').value,fs=[...$('files').files];if(!id||!fs.length){note('Choisissez un logement et au moins une photo.');return}if(photos.length+fs.length>20){note('Maximum 20 photos par logement.');return}$('uploadBtn').disabled=true;let pos=photos.length+1;for(const f of fs){if(f.size>5*1024*1024){note('Une photo dépasse 5 Mo : '+f.name);continue}const ext=(f.name.split('.').pop()||'jpg').toLowerCase();const path=user.id+'/'+id+'/'+crypto.randomUUID()+'.'+ext;const {error:up}=await sb.storage.from('listing-images').upload(path,f,{contentType:f.type,upsert:false});if(up){note(up.message);continue}const {error:ins}=await sb.from('listing_photos').insert({listing_id:id,storage_path:path,position:pos++});if(ins){await sb.storage.from('listing-images').remove([path]);note(ins.message)}}$('files').value='';$('uploadBtn').disabled=false;note('Photos importées.');load()}
window.deletePhoto=async id=>{const p=photos.find(x=>x.id===id);if(!p||!confirm('Supprimer cette photo ?'))return;const {error}=await sb.from('listing_photos').delete().eq('id',id);if(error){note(error.message);return}await sb.storage.from('listing-images').remove([p.storage_path]);await normalize();load()}
async function normalize(){for(let i=0;i<photos.length;i++)await sb.from('listing_photos').update({position:i+1}).eq('id',photos[i].id)}
window.movePhoto=async(id,dir)=>{const i=photos.findIndex(x=>x.id===id),j=i+dir;if(i<0||j<0||j>=photos.length)return;const a=photos[i],b=photos[j],pa=a.position,pb=b.position;await sb.from('listing_photos').update({position:999}).eq('id',a.id);await sb.from('listing_photos').update({position:pa}).eq('id',b.id);await sb.from('listing_photos').update({position:pb}).eq('id',a.id);load()}
$('publishBtn').onclick=async()=>{
  const id=$('listing').value;
  if(!id){note('Ajoutez d’abord un logement.');return}
  await load();
  if(!photos.length){note('Ajoutez au moins une photo avant de publier.');return}
  $('publishBtn').disabled=true;
  const {error}=await sb.functions.invoke('moderate-listing',{body:{listing_id:id}});
  $('publishBtn').disabled=false;
  if(error){note('La publication n’a pas pu être lancée : '+error.message);return}
  note('Annonce envoyée à la modération Abracadeal.');
  setTimeout(()=>location.href='espace-hote.html',900);
}
boot();
</script><script src="vacation-presence.js?v=20260920-1"></script>
</body></html>
