<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Désinscription — Abracadeal</title>
<link rel="icon" href="/favicon.ico?v=3" sizes="any">
<style>
:root{--bg:#160a24;--card:#241037;--line:rgba(255,255,255,.12);--text:#fff;--muted:#ddd6fe;--accent:#7c3aed;--err:#b91c1c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
main{max-width:560px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:34px 26px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.logo{font-size:32px;font-weight:800}.tag{color:#d8b4fe;letter-spacing:.2em;font-size:12px;margin:6px 0 26px}
h1{font-size:23px;margin:0 0 12px}p{color:var(--muted);line-height:1.6;margin:0 0 20px}
button{border:0;border-radius:14px;padding:14px 22px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,#7b2aa8,#ec3fa4);cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
a{color:#d8b4fe}
</style>
</head>
<body>
<main>
  <div class="logo">Abracadeal</div>
  <div class="tag">FAIS TON VŒU</div>
  <h1 id="title">Ne plus recevoir nos e-mails</h1>
  <p id="msg">Cliquez sur le bouton ci-dessous pour ne plus recevoir les e-mails de présentation d’Abracadeal destinés aux professionnels.</p>
  <button id="btn">Confirmer ma désinscription</button>
</main>
<script>
const q=new URLSearchParams(location.search),u=q.get('u')||'',t=q.get('t')||'';
const btn=document.getElementById('btn'),title=document.getElementById('title'),msg=document.getElementById('msg');
function done(ok){
  btn.remove();
  title.textContent=ok?'Vous êtes désinscrit':'Lien invalide';
  msg.innerHTML=ok?'Votre demande a bien été prise en compte. Vous ne recevrez plus nos e-mails de prospection.'
    :'Ce lien de désinscription n’est pas valide. Vous pouvez simplement répondre à l’e-mail reçu avec le mot <b>STOP</b>.';
}
if(!/^[0-9a-f-]{36}$/.test(u)||!t)done(false);
btn.addEventListener('click',async()=>{
  btn.disabled=true;btn.textContent='Enregistrement…';
  try{
    const r=await fetch('https://jplzvxmpbpjssyinozap.supabase.co/functions/v1/prospect-mailer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'unsubscribe',u,t})});
    const d=await r.json().catch(()=>({}));done(!!d.ok);
  }catch(_){btn.disabled=false;btn.textContent='Réessayer';msg.textContent='Erreur de connexion. Réessayez dans un instant.'}
});
</script>
</body>
</html>
