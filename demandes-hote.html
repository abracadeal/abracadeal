<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demandes de séjour — Abracadeal Hôte</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f7f3f9;--card:#fff;--ink:#21132d;--muted:#77677f;--line:#e8dced;--p:#6f218c;--pink:#e746a3;--ok:#16794a;--bad:#b4234f;--warn:#a56308;--shadow:0 18px 45px rgba(47,17,63,.09)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}a{text-decoration:none;color:inherit}button{font:inherit}.top{background:#1c0b2b;color:#fff}.topin{width:min(1000px,calc(100% - 28px));margin:auto;min-height:68px;display:flex;align-items:center;justify-content:space-between}.wrap{width:min(1000px,calc(100% - 28px));margin:28px auto 60px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);margin-top:14px}.row{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.muted{color:var(--muted)}.pill{display:inline-flex;padding:6px 9px;border-radius:999px;font-size:.74rem;font-weight:850;background:#f1e7f5;color:var(--p)}.pending{background:#fff4df;color:var(--warn)}.accepted{background:#eaf7ef;color:var(--ok)}.rejected,.cancelled{background:#f2edf4;color:#745f7d}.btn{border:0;border-radius:12px;min-height:42px;padding:0 13px;font-weight:850;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}.primary{background:linear-gradient(135deg,#842aaa,var(--pink));color:#fff}.soft{background:#f3eaf6;color:var(--p)}.danger{background:#fff0f3;color:var(--bad)}.actions{display:flex;gap:8px;flex-wrap:wrap}.empty{border:1px dashed #d8c9df;border-radius:16px;padding:26px;text-align:center;color:var(--muted)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-weight:800;cursor:pointer}.tab.active{background:#341347;color:#fff;border-color:#341347}
@media(max-width:650px){.row{flex-direction:column}.actions{width:100%}.actions .btn{flex:1}}
</style></head><body>
<header class="top"><div class="topin"><b>Abracadeal Hôte · Demandes</b><a href="espace-hote.html">← Espace Hôte</a></div></header>
<main class="wrap">
<h1>Demandes de séjour</h1><p class="muted">Acceptez ou refusez les demandes reçues. Une demande acceptée bloque automatiquement les dates.</p>
<div class="tabs"><button class="tab active" data-filter="pending">À traiter</button><button class="tab" data-filter="accepted">Acceptées</button><button class="tab" data-filter="rejected">Refusées</button><button class="tab" data-filter="all">Toutes</button></div>
<div id="list"></div>
</main>
<script>
const SUPABASE_URL='https://jplzvxmpbpjssyinozap.supabase.co',SUPABASE_KEY='sb_publishable_lUCkpzyw0kQCs9AWraNjzw_2CoT0JeF';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),$=id=>document.getElementById(id);let user=null,requests=[],filter='pending';
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function boot(){const {data:{user:u}}=await sb.auth.getUser();if(!u){location.href='espace-hote.html';return}user=u;await load()}
async function load(){const {data,error}=await sb.from('vacation_requests').select('*,listings(title,city)').eq('host_id',user.id).order('created_at',{ascending:false});if(error){$('list').innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}requests=data||[];const ids=[...new Set(requests.map(x=>x.traveler_id))];let profiles={};if(ids.length){const {data:p}=await sb.from('public_profiles').select('id,display_name,city').in('id',ids);(p||[]).forEach(x=>profiles[x.id]=x)}render(profiles)}
function render(profiles){const rows=filter==='all'?requests:requests.filter(x=>x.status===filter);$('list').innerHTML=rows.length?rows.map(r=>{const p=profiles[r.traveler_id]||{};return '<div class="card"><div class="row"><div><span class="pill '+r.status+'">'+label(r.status)+'</span><h2 style="margin:8px 0 6px">'+esc(r.listings?.title||'Logement')+'</h2><div class="muted">'+new Date(r.starts_on+'T12:00').toLocaleDateString('fr-FR')+' → '+new Date(r.ends_on+'T12:00').toLocaleDateString('fr-FR')+' · '+r.guests+' voyageur(s)</div><div style="margin-top:10px"><b>'+esc(p.display_name||'Voyageur Abracadeal')+'</b>'+(p.city?' · '+esc(p.city):'')+'</div>'+(r.message?'<p>'+esc(r.message)+'</p>':'')+'</div><div class="actions"><a class="btn soft" href="profil-vacances.html?user='+r.traveler_id+'">Profil voyageur</a>'+(r.status==='pending'?'<button class="btn primary" onclick="decide(\''+r.id+'\',\'accepted\')">Accepter</button><button class="btn danger" onclick="decide(\''+r.id+'\',\'rejected\')">Refuser</button>':'')+(r.conversation_id?'<a class="btn soft" href="gestion-sejour.html?conversation='+r.conversation_id+'">Séjour</a>':'')+'</div></div></div>'}).join(''):'<div class="empty">Aucune demande dans cette catégorie.</div>'}
function label(s){return ({pending:'À traiter',accepted:'Acceptée',rejected:'Refusée',cancelled:'Annulée'})[s]||s}
window.decide=async(id,decision)=>{const {error}=await sb.rpc('host_decide_vacation_request',{p_request_id:id,p_decision:decision});if(error){alert(error.message);return}await load()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');load()});
boot();
</script></body></html>
