async function edge(name,body){const {data:{session}}=await sb.auth.getSession();if(!session)throw Error('Connexion requise');const r=await fetch(U+'/functions/v1/'+name,{method:'POST',headers:{Authorization:'Bearer '+session.access_token,apikey:K,'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Action impossible');return d}

function renderPublicationRecap(chosen,target){const isPro=target.seller_type==='professionnel',tax=isPro?' HT':' TTC',total=chosen.reduce((t,o)=>t+Number(o.amount_cents),0);const grid=document.getElementById('grid');grid.innerHTML='';const c=document.createElement('article');c.className='card';c.style.gridColumn='1/-1';c.style.maxWidth='560px';c.style.margin='0 auto';c.style.width='100%';c.innerHTML='<strong>Récapitulatif</strong>'+chosen.map(o=>'<div style="display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:8px 0"><span>'+esc(o.label)+'</span><strong style="white-space:nowrap">'+eur(o.amount_cents)+tax+'</strong></div>').join('')+'<div style="display:flex;justify-content:space-between;gap:12px;padding-top:6px"><strong>Total</strong><span class="price">'+eur(total)+tax+'</span></div><p class="note">Un seul paiement pour toutes les options. Elles sont activées dès la confirmation du paiement.</p><button class="btn">Payer '+eur(total)+tax+'</button>';c.querySelector('button').onclick=()=>buyMany(chosen,target.id);grid.appendChild(c)}

async function wallet(){const {data,error}=await sb.rpc('get_my_commerce_boost_wallet');if(error)return;const r=Array.isArray(data)?data[0]:data,n=Number(r?.available_credits||0);if(!n)return;const w=document.getElementById('wallet'),active=listings.filter(x=>x.status==='active');w.classList.remove('hidden');w.innerHTML='<span><strong>'+n+' boost'+(n>1?'s':'')+' disponible'+(n>1?'s':'')+'</strong><br><span class="note">Les crédits n’expirent pas. Un boost remonte immédiatement l’annonce.</span></span><span><select id="boostListing"><option value="">Choisir une annonce active</option>'+active.map(l=>'<option value="'+esc(l.id)+'">'+esc(l.title)+'</option>').join('')+'</select><button class="btn" style="margin-top:7px;width:100%" onclick="useBoost()">Utiliser 1 boost</button></span>'}
async function showRevisions(){
 const {data:{session}}=await sb.auth.getSession();if(!session)return;
 let query=sb.from('listings').select('id,title,status,revision_of').eq('owner_id',session.user.id).not('revision_of','is',null).not('status','in','(archived,rejected)');
 if(revisionId)query=query.eq('id',revisionId);
 const {data:rows,error}=await query;
 if(error)throw Error('Impossible de charger la modification. Réessayez.');
 if(!rows?.length){if(revisionId)throw Error('Cette modification n’est plus disponible. Retrouvez votre annonce dans Mes annonces.');return;}
 const {data:offers}=await sb.rpc('get_my_commerce_pricing'),offer=(offers||[]).find(x=>x.code==='private_listing_edit');if(!offer){if(revisionId)throw Error('Le tarif de modification est indisponible. Réessayez plus tard.');return;}
 for(const r of rows){const c=document.createElement('article');c.className='card';if(!revisionId){c.innerHTML='<strong>Modification en attente : '+esc(r.title)+'</strong><button class="btn">Reprendre la modification</button>';c.querySelector('button').onclick=()=>location.href='options-annonce.html?revision='+encodeURIComponent(r.id);document.getElementById('grid').prepend(c);continue;}c.innerHTML='<strong>'+esc(r.title)+'</strong><p class="price">Modifier et remonter : '+eur(offer.amount_cents)+' TTC</p><p>Cette modification vous sera facturée au montant indiqué ci-dessus. Après paiement et validation par la modération, votre annonce remontera en tête des résultats.</p><p class="note">Pendant la vérification, l’ancienne version reste en ligne avec ses options. Si la modification est refusée, elle reste inchangée.</p><button class="btn">Payer pour modifier et remonter</button><button class="btn secondary" data-cancel-revision>Annuler la modification</button>';c.querySelector('button').onclick=async()=>{try{if(!await confirmOptionPurchase())return;showPaymentLoading();const d=await edge('create-commerce-order',{offer_code:offer.code,listing_id:r.revision_of,revision_id:r.id,withdrawal_accepted:true});if(!d.checkout_url)throw Error('Paiement indisponible. Réessayez.');location.href=d.checkout_url}catch(e){hidePaymentLoading();alert(e.message)}};c.querySelector('[data-cancel-revision]').onclick=async()=>{if(!confirm('Annuler cette proposition ? L’ancienne annonce et ses options seront conservées.'))return;try{await edge('prepare-listing-edit',{action:'cancel',listing_id:r.id});c.remove();if(revisionId){const st=document.getElementById('status');st.textContent='Modification annulée. Votre annonce et ses options restent en ligne.';st.classList.remove('hidden');}}catch(e){alert(e.message);}};document.getElementById('grid').prepend(c);}
}

function photoOf(l){const ph=[...(l?.listing_photos||[])].sort((a,b)=>(a.position||0)-(b.position||0))[0];if(!ph?.storage_path)return '';if(/^https?:\/\//.test(ph.storage_path))return ph.storage_path;if(ph.storage_bucket&&ph.storage_bucket!=='listing-images')return '';try{return sb.storage.from('listing-images').getPublicUrl(ph.storage_path).data.publicUrl||''}catch(_){return ''}}
function renderCompact(options,pro){
 const tax=pro?' HT':' TTC';
 const active=listings.filter(x=>x.status==='active');
 const grid=document.getElementById('grid');grid.innerHTML='';grid.classList.add('grid-compact');
 if(!active.length){const c=document.createElement('article');c.className='card compact empty';c.innerHTML='<div class="cmp-empty-ico">📢</div><strong>Aucune annonce en ligne</strong><p class="note">Les options s’achètent sur une annonce déjà en ligne. Publiez une annonce, puis revenez ici après sa validation.</p><a class="btn" href="index.html">Publier une annonce</a>';grid.appendChild(c);return}
 const groups=[['featured','⭐','À la une','En tête de sa catégorie, une durée au choix'],['daily_bump','🔁','Remontée quotidienne','Remonte en haut des résultats chaque matin'],['urgent','⚡','Badge Urgent','Badge visible jusqu’à la fin de l’annonce'],['boost_pack','🚀','Pack de remontées','Remontées ponctuelles, sans date limite'],['photo_option','📷','Photos supplémentaires','À ajouter ensuite via « Modifier »']];

 const picked=new Map(),pre=new URLSearchParams(location.search).get('listing');
 let current=active.length===1?active[0].id:(pre&&active.some(l=>l.id===pre)?pre:'');

 const listingCard=l=>{const img=photoOf(l);return '<button type="button" class="lst" data-id="'+esc(l.id)+'"><span class="lst-img"'+(img?' style="background-image:url(&quot;'+esc(img)+'&quot;)"':'')+'>'+(img?'':'🖼️')+'</span><span class="lst-txt"><strong>'+esc(l.title)+'</strong>'+(l.price!=null&&l.price!==''?'<span>'+money(l.price)+'</span>':'')+'</span><span class="lst-check" aria-hidden="true"></span></button>'};
 const groupCard=([t,ico,title,desc])=>{const list=options.filter(o=>o.offer_type===t);if(!list.length)return '';return '<section class="opt" data-group="'+t+'"><div class="opt-head"><span class="opt-ico">'+ico+'</span><span><strong>'+esc(title)+'</strong><span>'+esc(desc)+'</span></span></div><div class="cmp-rows">'+list.map(o=>'<button type="button" class="cmp-row" data-code="'+esc(o.code)+'" data-type="'+esc(t)+'"><span class="cmp-tick" aria-hidden="true"></span><span>'+esc(short(o))+'</span><span class="cmp-price">'+eur(o.amount_cents)+'</span></button>').join('')+'</div>'+(t==='featured'?'<div class="note cmp-slot"></div>':'')+'</section>'};
 const wrap=document.createElement('div');wrap.className='cmp-layout';
 wrap.innerHTML='<div class="cmp-main">'
  +'<div class="cmp-step"><span class="cmp-num">1</span><h2>Choisissez votre annonce</h2></div><div class="lst-list">'+active.map(listingCard).join('')+'</div>'
  +'<div class="cmp-step"><span class="cmp-num">2</span><h2>Choisissez vos options</h2></div><div class="opt-grid">'+groups.map(groupCard).join('')+'</div>'
  +'</div><aside class="cmp-side"><div class="sum card"><strong class="sum-title">Récapitulatif</strong><div class="sum-listing note"></div><div class="sum-lines"></div><div class="sum-total"><span>Total</span><strong>0 €'+tax+'</strong></div><button class="btn" id="cmpPay" disabled>Payer</button><p class="note">Prix'+tax+'. Un seul paiement, options activées dès la confirmation. Aucune option n’est cochée par défaut.</p></div></aside>';
 grid.appendChild(wrap);
 const q=x=>wrap.querySelector?.(x)||{},qa=x=>[...(wrap.querySelectorAll?.(x)||[])];
 const pay=q('#cmpPay'),slot=q('.cmp-slot');let full=false;
 const chosenList=()=>[...picked.values()].map(code=>options.find(o=>o.code===code)).filter(Boolean);
 const fits=o=>o.offer_type!=='photo_option'||!current||compatible(o).some(l=>l.id===current);
 const refresh=()=>{

 };
 const checkSlot=async()=>{full=false;if(slot)slot.textContent='';if(!current||!picked.has('featured'))return refresh();try{const {data}=await sb.rpc('featured_slot_availability',{p_listing_id:current});const s=Array.isArray(data)?data[0]:data;if(s){if(s.already_featured)slot.textContent='Déjà À la une : la durée s’ajoute.';else{const n=Number(s.available);if(n<=0){full=true;slot.innerHTML='<strong>Complet</strong> dans votre département pour cette catégorie. Réessayez dans quelques jours.'}else slot.innerHTML='Plus que <strong>'+n+' place'+(n>1?'s':'')+'</strong> À la une dans votre département.'}}}catch(_){}refresh()};
