<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Profil Vacances — Abracadeal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="assets/profil-vacances.css?v=20261002-1"><link rel="stylesheet" href="assets/mobile-safety-20260919.css?v=20260919-1">
</head>
<body>
<header class="top"><div class="topin"><a class="brand" href="vacances.html">Abracadeal <span>Vacances</span></a><a href="vacances.html">← Retour</a></div></header>
<main class="wrap">
<div id="loading" class="card">Chargement du profil…</div>
<div id="profileView" class="hidden">
  <section class="card profile">
    <div class="profileMain"><div id="avatar" class="avatar">A</div><div><div><span id="hostBadge" class="pill hidden">Hôte</span><span id="travelerBadge" class="pill hidden">Voyageur</span></div><h1 id="name"></h1><div id="city" class="muted"></div><div id="joined" class="muted" style="margin-top:4px"></div></div></div>
  </section>
  <section class="summary">
    <div class="metric"><span>Note comme hôte</span><strong id="hostAvg">—</strong><div id="hostCount" class="muted"></div></div>
    <div class="metric"><span>Note comme voyageur</span><strong id="travAvg">—</strong><div id="travCount" class="muted"></div></div>
    <div class="metric"><span>Avis publiés</span><strong id="allCount">0</strong><div class="muted">séjours confirmés</div></div>
  </section>
  <section class="card section">
    <div class="tabs"><button class="tab active" data-role="host">Avis comme hôte</button><button class="tab" data-role="traveler">Avis comme voyageur</button></div>
    <div id="hostPanel" class="panel active"></div>
    <div id="travelerPanel" class="panel"></div>
  </section>
</div>
</main>
<script src="assets/profil-vacances.js?v=20261002-1"></script>
<script src="vacation-presence.js?v=20260920-1"></script>
</body></html>
