<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profil Vacances — Abracadeal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f8f4fa;--card:#fff;--ink:#21132d;--muted:#77677f;--line:#e8dced;--p:#6f218c;--pink:#e746a3;--shadow:0 18px 45px rgba(47,17,63,.09)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}a{text-decoration:none;color:inherit}.top{background:#1c0b2b;color:#fff}.topin{width:min(980px,calc(100% - 28px));margin:auto;min-height:68px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900}.brand span{color:#ff65be}.wrap{width:min(980px,calc(100% - 28px));margin:28px auto 60px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow);margin-top:16px}.profile{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.avatar{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#7d28a2,#ef4ca9);color:#fff;font-size:1.7rem;font-weight:900}.profileMain{display:flex;gap:16px}.profile h1{margin:3px 0 6px;font-size:2rem}.muted{color:var(--muted)}.pill{display:inline-flex;padding:6px 10px;border-radius:999px;background:#f1e7f5;color:var(--p);font-size:.76rem;font-weight:850;margin-right:6px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.metric{border:1px solid var(--line);border-radius:16px;padding:15px}.metric span{display:block;color:var(--muted);font-size:.78rem}.metric strong{font-size:1.5rem}.section h2{margin:0 0 10px}.review{border-top:1px solid var(--line);padding:16px 0}.review:first-child{border-top:0}.stars{color:#f0a500;font-size:1.05rem;letter-spacing:.05em}.reviewHead{display:flex;justify-content:space-between;gap:10px}.reply{margin-top:10px;padding:11px 13px;background:#f8f3fa;border-radius:12px}.empty{border:1px dashed #d8c9df;border-radius:16px;padding:22px;text-align:center;color:var(--muted)}.tabs{display:flex;gap:8px;margin-bottom:14px}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-weight:800;cursor:pointer}.tab.active{background:#341347;color:#fff;border-color:#341347}.panel{display:none}.panel.active{display:block}
@media(max-width:650px){.profile{flex-direction:column}.summary{grid-template-columns:1fr}.profileMain{align-items:center}.profile h1{font-size:1.6rem}}
</style><link rel="stylesheet" href="assets/mobile-safety-20260919.css?v=20260919-1">\n</head>
<body>
<header class="top"><div class="topin"><a class="brand" href="vacances.html">Abracadeal <span>Vacances</span></a><a href="vacances.html">← Retour</a></div></header>
<main class="wrap">
<div id="loading" class="card">Chargement du profil…</div>
<div id="profileView" class="hidden">
  <section class="card profile">
    <div class="profileMain"><div id="avatar" class="avatar">A</div><div><div><span id="hostBadge" class="pill hidden">Hôte</span><span id="travelerBadge" class="pill hidden">Voyageur</span></div><h1 id="name"></h1><div id="city" class="muted"></div><div id="joined" class="muted" style="margin-top:4px"></div></div></div>
  </section>
  <section class="summary">
    <div class="metric"><span>Note comme hôte</span><strong id="hostAvg">—</strong><div id="hostCount" class="muted"></div></div>
    <div class="metric"><span>Note comme voyageur</span><strong id="travAvg">—</strong><div id="travCount" class="muted"></div></div>
    <div class="metric"><span>Avis publiés</span><strong id="allCount">0</strong><div class="muted">séjours confirmés</div></div>
  </section>
  <section class="card section">
    <div class="tabs"><button class="tab active" data-role="host">Avis comme hôte</button><button class="tab" data-role="traveler">Avis comme voyageur</button></div>
    <div id="hostPanel" class="panel active"></div>
    <div id="travelerPanel" class="panel"></div>
  </section>
</div>
</main>
<script>
const SUPABASE_URL='https://jplzvxmpbpjssyinozap.supabase.co',SUPABASE_KEY='sb_publishable_lUCkpzyw0kQCs9AWraNjzw_2CoT0JeF';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),$=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function stars(n){return '★'.repeat(n)+'☆'.repeat(5-n)}
function avg(a){return a.length?(a.reduce((s,x)=>s+Number(x.rating),0)/a.length).toFixed(1).replace('.',','):'—'}
function reviewHtml(r,names){return '<div class="review"><div class="reviewHead"><div><b>'+esc(names[r.reviewer_id]||'Membre Abracadeal')+'</b><div class="stars">'+stars(Number(r.rating))+'</div></div><small class="muted">'+new Date(r.created_at).toLocaleDateString('fr-FR')+'</small></div><p>'+esc(r.comment)+'</p>'+(r.subject_reply?'<div class="reply"><b>Réponse</b><div>'+esc(r.subject_reply)+'</div></div>':'')+'</div>'}
async function boot(){
 const userId=new URLSearchParams(location.search).get('user');if(!userId){$('loading').textContent='Profil introuvable.';return}
 const [{data:p},{data:rev},{data:hostListings}]=await Promise.all([
   sb.from('public_profiles').select('*').eq('id',userId).maybeSingle(),
   sb.from('vacation_reviews').select('id,reviewer_id,subject_id,subject_role,rating,comment,subject_reply,created_at').eq('subject_id',userId).eq('status','active').order('created_at',{ascending:false}),
   sb.from('listings').select('id').eq('owner_id',userId).eq('category','vacances').eq('status','active').limit(1)
 ]);
 if(!p){$('loading').textContent='Profil introuvable.';return}
 const reviews=rev||[],hostR=reviews.filter(x=>x.subject_role==='host'),travR=reviews.filter(x=>x.subject_role==='traveler');
 const ids=[...new Set(reviews.map(x=>x.reviewer_id))];let names={};
 if(ids.length){const {data:ps}=await sb.from('public_profiles').select('id,display_name').in('id',ids);(ps||[]).forEach(x=>names[x.id]=x.display_name)}
 $('name').textContent=p.display_name||'Membre Abracadeal';$('avatar').textContent=(p.display_name||'A').trim().charAt(0).toUpperCase();$('city').textContent=p.city||'';$('joined').textContent='Membre depuis '+new Date(p.joined_at).toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
 $('hostBadge').classList.toggle('hidden',!(hostListings?.length||hostR.length));$('travelerBadge').classList.toggle('hidden',!travR.length);
 $('hostAvg').textContent=hostR.length?'⭐ '+avg(hostR):'—';$('hostCount').textContent=hostR.length+' avis';$('travAvg').textContent=travR.length?'⭐ '+avg(travR):'—';$('travCount').textContent=travR.length+' avis';$('allCount').textContent=reviews.length;
 $('hostPanel').innerHTML=hostR.length?hostR.map(x=>reviewHtml(x,names)).join(''):'<div class="empty">Aucun avis publié comme hôte.</div>';
 $('travelerPanel').innerHTML=travR.length?travR.map(x=>reviewHtml(x,names)).join(''):'<div class="empty">Aucun avis publié comme voyageur.</div>';
 $('loading').classList.add('hidden');$('profileView').classList.remove('hidden')
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.role==='host'?'hostPanel':'travelerPanel').classList.add('active')});
boot();
</script>
</body></html>
