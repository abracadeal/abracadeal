name: Vacances text contrast

on:
  push:
    paths:
      - '.github/workflows/vacances-text-contrast.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply text contrast patch
        run: python .github/patch_vac_text_contrast.py
      - name: Commit
        run: |
          git config user.name 'abracadeal'
          git config user.email 'abracadeal@gmail.com'
          git add assets/vacances-ui.css vacances.html
          git diff --cached --quiet || git commit -m 'Éclaircit les textes de la page Vacances'
          git push
