name: Fix auth domain and refresh
on:
  push:
    paths:
      - '.github/workflows/fix-auth-domain.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch auth flow
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          s=s.replace("https://abracadeal.github.io/abracadeal/","https://abracadeal.fr/")
          old="  if(error){toast(error.message);return}\\n  closeModal('accountModal'); toast('Connexion réussie');"
          new="  if(error){\\n    const msg=(error.code==='invalid_credentials'||/invalid login credentials/i.test(error.message||'')) ? 'E-mail ou mot de passe incorrect.' : (error.message||'Connexion impossible.');\\n    toast(msg);return;\\n  }\\n  await refreshAuth({preserveEditing:false});\\n  if(!currentUser){toast('Connexion reçue mais session non chargée. Recharge la page.');return;}\\n  closeModal('accountModal'); toast('Connexion réussie');"
          if old not in s:
              raise SystemExit("login handler target not found")
          s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8")
          PY
      - name: Commit fix
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "Abracadeal Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Fix auth redirect domain and session refresh"
          git push
