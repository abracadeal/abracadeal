# Pages publiques des annonces (referencement Google + apercu WhatsApp/Facebook), pages categories/villes
# hubs SEO Auto (marques, modeles, energies, budgets) et pages des pros (garage/, immo/, professionnel/).
name: Pages de partage des annonces

on:
  schedule:
    # 17/11/2026 : toutes les 30 min (au lieu de 10) — compte GitHub signalé le 17/11, on calme l'activité automatique
    - cron: "17 */4 * * *"  # 23/11/2026 : toutes les 4 h (Egress : 61 Mo le 22/11, marge trop juste) ; 21/11 : toutes les 2 h et seulement si des annonces ont changé (quota Egress Supabase), avant : 30 min
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/listings_stamp.py, scripts/abraca_gzip.py, scripts/build_share_pages.py, scripts/build_auto_seo_pages.py, scripts/build_pro_pages.py, scripts/build_chatgpt_feed.py, scripts/build_catalog_feed.py, scripts/build_communes_file.py, .github/workflows/share-pages.yml]

permissions:
  contents: write

concurrency:
  group: share-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 21/11/2026 (quota Egress Supabase) : si aucune annonce n'a changé depuis le dernier passage, on ne relit rien
      # (passage complet forcé toutes les 6 h et à chaque modification des scripts).
      - id: check
        run: python scripts/listings_stamp.py check >> "$GITHUB_OUTPUT" && cat "$GITHUB_OUTPUT"
      - if: steps.check.outputs.run == 'true'
        run: pip install pillow==10.4.0
      - if: steps.check.outputs.run == 'true'
        run: python scripts/build_share_pages.py
      - if: steps.check.outputs.run == 'true'
        run: python scripts/build_auto_seo_pages.py
      - if: steps.check.outputs.run == 'true'
        run: python scripts/build_pro_pages.py
      - if: steps.check.outputs.run == 'true'
        run: python scripts/build_chatgpt_feed.py
      - if: steps.check.outputs.run == 'true'
        run: python scripts/build_catalog_feed.py
      # 15/11/2026 : liste des communes en fichier statique pour pro-stock-sync (au lieu de 1,4 Mo lus dans Supabase ~250 fois/jour)
      - if: steps.check.outputs.run == 'true'
        run: 'python scripts/build_communes_file.py || echo "liste des communes non mise a jour"'
      - if: steps.check.outputs.run == 'true'
        run: python scripts/listings_stamp.py save
      - name: Publier les changements
        if: steps.check.outputs.run == 'true'
        run: |
          git add -A annonce annonces auto feeds pro-pages.json sitemap-annonces.xml sitemap-categories.xml sitemap-auto.xml sitemap-pros.xml data/listings-stamp.txt
          # Dossiers des pages pros : absents tant qu'aucun pro n'a d'annonce en ligne (git add échouerait)
          for p in garage immo professionnel; do
            if [ -e "$p" ] || git ls-files --error-unmatch "$p" >/dev/null 2>&1; then git add -A "$p"; fi
          done
          # 02/11/2026 : adresses courtes des showrooms (abracadeal.fr/weecars-angers) — actuelles et anciennes (supprimées)
          for p in $( (cat pro-pages.json; git show HEAD:pro-pages.json 2>/dev/null) | python -c "import sys,re;print(' '.join(sorted(set(re.findall(r'\"short\": \"([a-z0-9-]+)\"',sys.stdin.read())))))"); do
            if [ -e "$p" ] || git ls-files --error-unmatch "$p" >/dev/null 2>&1; then git add -A "$p"; fi
          done
          if git diff --cached --quiet; then echo "Aucun changement"; exit 0; fi
          git config user.name "abracadeal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Pages SEO : mise a jour automatique"
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          # 15/11/2026 : si une autre publication est passée entre-temps (conflit sur un fichier généré, ex. feeds/catalog.json),
          # notre version — la plus récente — l'emporte (-X theirs = le commit rejoué), et un rebase raté est annulé avant de réessayer.
          for i in 1 2 3; do
            if git pull --rebase -X theirs -q origin main && git push -q origin main; then
              # Moteurs IndexNow (Bing…) prévenus des pages nouvelles ou modifiées, 1 min après la mise en ligne
              sleep 60; echo "$CHANGED" | python scripts/indexnow.py || true
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          # 17/11/2026 : conflit insoluble (ex. photo renommée/supprimée par une publication simultanée) :
          # pas d'échec — la passe suivante régénère tout depuis la dernière version en ligne.
          echo "::warning::Publication reportée à la passe suivante (conflit avec une publication simultanée)"
          exit 0
