# Pages publiques des annonces (referencement Google + apercu WhatsApp/Facebook), pages categories/villes
# hubs SEO Auto (marques, modeles, energies, budgets) et pages des pros (garage/, immo/, professionnel/).
name: Pages de partage des annonces

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/build_share_pages.py, scripts/build_auto_seo_pages.py, scripts/build_pro_pages.py, .github/workflows/share-pages.yml]

permissions:
  contents: write

concurrency:
  group: share-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==10.4.0
      - run: python scripts/build_share_pages.py
      - run: python scripts/build_auto_seo_pages.py
      - run: python scripts/build_pro_pages.py
      - name: Publier les changements
        run: |
          git add -A annonce annonces auto pro-pages.json sitemap-annonces.xml sitemap-categories.xml sitemap-auto.xml sitemap-pros.xml
          # Dossiers des pages pros : absents tant qu'aucun pro n'a d'annonce en ligne (git add échouerait)
          for p in garage immo professionnel; do
            if [ -e "$p" ] || git ls-files --error-unmatch "$p" >/dev/null 2>&1; then git add -A "$p"; fi
          done
          if git diff --cached --quiet; then echo "Aucun changement"; exit 0; fi
          git config user.name "abracadeal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Pages SEO : mise a jour automatique"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin main && exit 0; sleep 5; done
          exit 1
