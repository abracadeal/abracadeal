# Pages publiques des annonces (referencement Google + apercu WhatsApp/Facebook) et sitemap-annonces.xml.
# Regenere annonce/<id>/ toutes les 10 minutes environ (scripts/build_share_pages.py).
name: Pages de partage des annonces

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/build_share_pages.py, .github/workflows/share-pages.yml]

permissions:
  contents: write

concurrency:
  group: share-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==10.4.0
      - run: python scripts/build_share_pages.py
      - name: Publier les changements
        run: |
          git add -A annonce sitemap-annonces.xml
          if git diff --cached --quiet; then echo "Aucun changement"; exit 0; fi
          git config user.name "abracadeal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Pages de partage des annonces : mise a jour automatique"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin main && exit 0; sleep 5; done
          exit 1
