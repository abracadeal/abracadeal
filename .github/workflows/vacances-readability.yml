name: Vacances readability balance

on:
  push:
    paths:
      - '.github/workflows/vacances-readability.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply readability balance
        run: python .github/patch_vac_readability.py
      - name: Commit
        run: |
          git config user.name 'abracadeal'
          git config user.email 'abracadeal@gmail.com'
          git add assets/vacances-ui.css vacances.html
          git diff --cached --quiet || git commit -m 'Rééquilibre le fond et la lisibilité de Vacances'
          git push
