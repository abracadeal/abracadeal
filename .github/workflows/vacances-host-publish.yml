name: Vacances host wording update
on:
  push:
    branches: [main]
    paths:
      - '.github/vacances_host_patch.py'
      - '.github/workflows/vacances-host-publish.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply Vacances update
        run: python .github/vacances_host_patch.py
      - name: Commit changes
        run: |
          git config user.name "Abracadeal Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Vacances host wording and simulator"
            git push
          fi
