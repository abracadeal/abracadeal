name: Nettoyage page Pro Fondateurs v2
on:
  push:
    branches: [main]
    paths: [.github/workflows/cleanup-pro-founder-ui-once-v2.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retirer annonce unitaire et options de la page Fondateurs
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('pro-fondateur.html')
          s=p.read_text()
          # Retire la section options de visibilité du HTML statique.
          start='<section class="group"><h3>Options de visibilité</h3><div id="boostWallet" class="wallet hidden"></div><div id="optionGrid" class="grid"></div></section>'
          s=s.replace(start,'')
          # Filtre l'offre unitaire et toutes les options AVANT rendu dans la page Fondateurs.
          needle='const visible=offers.filter(o=>!mySectorGroup||o.category_group===mySectorGroup);'
          repl="const visible=offers.filter(o=>(!mySectorGroup||o.category_group===mySectorGroup)&&o.code!=='pro_autoimmo_single'&&!['featured','urgent','boost_pack','photo_option'].includes(o.offer_type));"
          if needle in s:
              s=s.replace(needle,repl,1)
          else:
              # Fallback robuste: ajoute un filtre au moment où les groupes sont calculés.
              old='const grouped={};visible.forEach(o=>(grouped[o.category_group]??=[]).push(o));'
              new="const grouped={};visible.filter(o=>o.code!=='pro_autoimmo_single'&&!['featured','urgent','boost_pack','photo_option'].includes(o.offer_type)).forEach(o=>(grouped[o.category_group]??=[]).push(o));"
              if old in s:s=s.replace(old,new,1)
          # Cache de sécurité si une ancienne logique réinjecte quelque chose.
          if 'founderPageHardCleanup' not in s:
              hard='''\n<script>\n(function founderPageHardCleanup(){\n const clean=()=>{\n  document.querySelectorAll('#pricingGroups .offer').forEach(c=>{const t=(c.textContent||'').replace(/\\s+/g,' ');if(t.includes('1 annonce')&&t.includes('24,99'))c.remove();});\n  const h=[...document.querySelectorAll('#privatePricing .group h3')].find(x=>x.textContent.trim()==='Options de visibilité');if(h)h.closest('.group')?.remove();\n };\n const root=document.getElementById('privatePricing');if(root)new MutationObserver(clean).observe(root,{childList:true,subtree:true});clean();\n})();\n</script>\n'''
              s=s.replace('</body>',hard+'</body>',1)
          p.write_text(s)
          PY
          git rm .github/workflows/cleanup-pro-founder-ui-once-v2.yml
          git add pro-fondateur.html
          git config user.name "abracadeal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Masque annonce unitaire et options sur la page Fondateurs"
          git pull --rebase origin main
          git push origin main
