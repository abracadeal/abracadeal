name: Fix parcours Pro onboarding (one-shot)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-pro-onboarding-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Corriger le parcours Pro
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('assets/index-main.js')
          app = Path('assets/index-app.js')

          main_text = main.read_text()
          app_text = app.read_text()

          old_quota = """  sb.from('pro_subscriptions').select('plan_code,status').eq('user_id',currentUser.id).maybeSingle().then(({data})=>{\n    const code=String(data?.plan_code||currentProfile?.pro_plan||currentProfile?.plan||'').toLowerCase();\n    const quota=(code.match(/250|100|50|20/)||[])[0] || (currentProfile?.account_type==='professionnel'?'250':'20');\n    set('proDashQuotaValue',active+' / '+quota);\n  });"""
          new_quota = """  sb.from('pro_subscriptions').select('plan_code,status').eq('user_id',currentUser.id).maybeSingle().then(({data})=>{\n    const enabled=!!data&&['active','trialing'].includes(String(data.status||'').toLowerCase());\n    const code=enabled?String(data.plan_code||'').toLowerCase():'';\n    const quota=(code.match(/250|100|50|20/)||[])[0];\n    set('proDashQuotaValue',quota?(active+' / '+quota):'Aucune formule');\n  });"""
          if main_text.count(old_quota) != 1:
              raise SystemExit(f'Bloc quota attendu introuvable ou duplique: {main_text.count(old_quota)}')
          main_text = main_text.replace(old_quota, new_quota, 1)

          old_ensure = """  async function ensureProPlanSelection(){\n    try{sessionStorage.removeItem('abraca_pro_plan_pending')}catch(_){}\n    if(document.getElementById('proPlanModal')?.classList.contains('open'))closeModal('proPlanModal');\n    return false;\n  }"""
          new_ensure = """  async function ensureProPlanSelection(){\n    if(!sb||!currentUser||currentProfile?.account_type!=='professionnel'||currentProfile?.is_admin===true)return false;\n    const {data,error}=await sb.from('pro_subscriptions').select('plan_code,status').eq('user_id',currentUser.id).maybeSingle();\n    if(error){console.warn('Vérification formule Pro indisponible',error);return false;}\n    const active=!!data&&['active','trialing'].includes(String(data.status||'').toLowerCase());\n    if(active){\n      try{sessionStorage.removeItem('abraca_pro_plan_pending')}catch(_){}\n      if(document.getElementById('proPlanModal')?.classList.contains('open'))closeModal('proPlanModal');\n      return false;\n    }\n    try{sessionStorage.setItem('abraca_pro_plan_pending','1')}catch(_){}\n    if(document.getElementById('proPlanModal')?.classList.contains('open'))closeModal('proPlanModal');\n    if(!/\\/pro-fondateur\\.html$/i.test(location.pathname))location.href='pro-fondateur.html';\n    return true;\n  }"""
          if app_text.count(old_ensure) != 1:
              raise SystemExit(f'Bloc ensure attendu introuvable ou duplique: {app_text.count(old_ensure)}')
          app_text = app_text.replace(old_ensure, new_ensure, 1)

          old_restore = """  function restoreMandatoryProPlanGate(){\n    if(document.getElementById('proPlanModal')?.classList.contains('open'))closeModal('proPlanModal');\n    try{sessionStorage.removeItem('abraca_pro_plan_pending')}catch(_){}\n  }"""
          new_restore = """  function restoreMandatoryProPlanGate(){\n    ensureProPlanSelection().catch(error=>console.warn('Contrôle formule Pro',error));\n  }"""
          if app_text.count(old_restore) != 1:
              raise SystemExit(f'Bloc restore attendu introuvable ou duplique: {app_text.count(old_restore)}')
          app_text = app_text.replace(old_restore, new_restore, 1)

          main.write_text(main_text)
          app.write_text(app_text)
          PY

      - name: Vérifications rapides
        run: |
          grep -F "Aucune formule" assets/index-main.js
          grep -F "location.href='pro-fondateur.html'" assets/index-app.js
          grep -F "['active','trialing']" assets/index-app.js

      - name: Commit et nettoyage du workflow one-shot
        run: |
          rm .github/workflows/fix-pro-onboarding-once.yml
          git config user.name "Abracadeal Bot"
          git config user.email "abracadeal@gmail.com"
          git add assets/index-main.js assets/index-app.js .github/workflows/fix-pro-onboarding-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "Corrige le parcours Pro avant abonnement"
          git push origin main
