name: Abracadeal publish update
on:
  push:
    paths:
      - '.github/abracadeal_patch.py'
      - '.github/workflows/abracadeal-publish.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply site patch
        run: python .github/abracadeal_patch.py
      - name: Commit and publish
        run: |
          git config user.name "Abracadeal Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Publish Abracadeal category and landscape fixes"
          git push
