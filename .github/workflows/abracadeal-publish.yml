name: Abracadeal publish update

on:
  push:
    branches: [main]
    paths:
      - '.github/abracadeal_patch.py'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply update
        run: python .github/abracadeal_patch.py
      - name: Commit changes
        run: |
          git config user.name "Abracadeal Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix categories and mobile landscape layout"
            git push
          fi
