name: Abracadeal publish update

on:
  push:
    branches: [main]
    paths:
      - '.github/abracadeal_patch.py'
      - '.github/workflows/abracadeal-publish.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Abracadeal update
        run: python .github/abracadeal_patch.py

      - name: Commit website changes
        run: |
          git config user.name "Abracadeal Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "Publish Abracadeal updates"
          git push origin main
