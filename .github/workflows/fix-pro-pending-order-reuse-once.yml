name: Reutiliser commande Pro en attente

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-pro-pending-order-reuse-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Corriger doublon commande Pro en attente
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/create-pro-subscription-order/index.ts')
          t=p.read_text()
          old=''' const billingStartsAt=founderFree&&freeUntil?freeUntil:now;const {data:order,error:orderError}=await admin.from("pro_subscription_orders").insert({user_id:user.id,plan_code:planCode,founder_number:founderEligible?founderNumber:null,enrolled_at:(founderEligible?founder?.enrolled_at:now.toISOString()),free_until:founderEligible&&freeUntil?freeUntil.toISOString():null,billing_starts_at:billingStartsAt.toISOString(),expected_payment_link_id:"checkout_session",status:"pending"}).select("*").single();if(orderError||!order)throw orderError||new Error("Commande impossible");'''
          new=''' const billingStartsAt=founderFree&&freeUntil?freeUntil:now;const orderPayload={user_id:user.id,plan_code:planCode,founder_number:founderEligible?founderNumber:null,enrolled_at:(founderEligible?founder?.enrolled_at:now.toISOString()),free_until:founderEligible&&freeUntil?freeUntil.toISOString():null,billing_starts_at:billingStartsAt.toISOString(),expected_payment_link_id:"checkout_session",status:"pending"};let {data:order}=await admin.from("pro_subscription_orders").select("*").eq("user_id",user.id).eq("plan_code",planCode).eq("status","pending").maybeSingle();if(order){const {data:updatedOrder,error:updateOrderError}=await admin.from("pro_subscription_orders").update({...orderPayload,stripe_checkout_session_id:null,updated_at:new Date().toISOString()}).eq("id",order.id).select("*").single();if(updateOrderError||!updatedOrder)throw updateOrderError||new Error("Commande impossible");order=updatedOrder}else{const {data:newOrder,error:orderError}=await admin.from("pro_subscription_orders").insert(orderPayload).select("*").single();if(orderError||!newOrder)throw orderError||new Error("Commande impossible");order=newOrder}'''
          if t.count(old)!=1:
              raise SystemExit(f'bloc commande introuvable: {t.count(old)}')
          p.write_text(t.replace(old,new,1))
          PY
      - name: Verification
        run: grep -F 'eq("status","pending").maybeSingle()' supabase/functions/create-pro-subscription-order/index.ts
      - name: Commit et nettoyage
        run: |
          rm .github/workflows/fix-pro-pending-order-reuse-once.yml
          git config user.name "Abracadeal Bot"
          git config user.email "abracadeal@gmail.com"
          git add supabase/functions/create-pro-subscription-order/index.ts .github/workflows/fix-pro-pending-order-reuse-once.yml
          git commit -m "Reutilise les commandes Pro en attente"
          git push origin main
