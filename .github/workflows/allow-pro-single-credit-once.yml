name: Autoriser annonce Pro a l'unite sans abonnement

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/allow-pro-single-credit-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Autoriser les credits d'annonce Pro
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('assets/index-app.js')
          text = app.read_text()

          old = """  async function ensureProPlanSelection(){
    if(!sb||!currentUser||currentProfile?.account_type!=='professionnel'||currentProfile?.is_admin===true)return false;
    const {data,error}=await sb.from('pro_subscriptions').select('plan_code,status').eq('user_id',currentUser.id).maybeSingle();
    if(error){console.warn('Vérification formule Pro indisponible',error);return false;}
    const active=!!data&&['active','trialing'].includes(String(data.status||'').toLowerCase());
    if(active){
      try{sessionStorage.removeItem('abraca_pro_plan_pending')}catch(_){}
      if(document.getElementById('proPlanModal')?.classList.contains('open'))closeModal('proPlanModal');
      return false;
    }
    try{sessionStorage.setItem('abraca_pro_plan_pending','1')}catch(_){}
    if(document.getElementById('proPlanModal')?.classList.contains('open'))closeModal('proPlanModal');
    if(!/\\/pro-fondateur\\.html$/i.test(location.pathname))location.href='pro-fondateur.html';
    return true;
  }"""

          new = """  async function ensureProPlanSelection(){
    if(!sb||!currentUser||currentProfile?.account_type!=='professionnel'||currentProfile?.is_admin===true)return false;
    const {data,error}=await sb.from('pro_subscriptions').select('plan_code,status').eq('user_id',currentUser.id).maybeSingle();
    if(error){console.warn('Vérification formule Pro indisponible',error);return false;}
    const active=!!data&&['active','trialing'].includes(String(data.status||'').toLowerCase());
    let hasSingleCredit=false;
    if(!active){
      const {data:wallet,error:walletError}=await sb.from('pro_listing_credit_wallet').select('credits').eq('user_id',currentUser.id).gt('credits',0).limit(1);
      if(walletError)console.warn('Vérification crédit annonce Pro indisponible',walletError);
      else hasSingleCredit=Array.isArray(wallet)&&wallet.some(row=>Number(row?.credits||0)>0);
    }
    if(active||hasSingleCredit){
      try{sessionStorage.removeItem('abraca_pro_plan_pending')}catch(_){}
      if(document.getElementById('proPlanModal')?.classList.contains('open'))closeModal('proPlanModal');
      return false;
    }
    try{sessionStorage.setItem('abraca_pro_plan_pending','1')}catch(_){}
    if(document.getElementById('proPlanModal')?.classList.contains('open'))closeModal('proPlanModal');
    if(!/\\/pro-fondateur\\.html$/i.test(location.pathname))location.href='pro-fondateur.html';
    return true;
  }"""

          if text.count(old) != 1:
              raise SystemExit(f'Bloc ensure attendu introuvable ou duplique: {text.count(old)}')
          app.write_text(text.replace(old,new,1))
          PY

      - name: Verification rapide
        run: |
          grep -F "pro_listing_credit_wallet" assets/index-app.js
          grep -F "hasSingleCredit" assets/index-app.js

      - name: Commit et nettoyage
        run: |
          rm .github/workflows/allow-pro-single-credit-once.yml
          git config user.name "Abracadeal Bot"
          git config user.email "abracadeal@gmail.com"
          git add assets/index-app.js .github/workflows/allow-pro-single-credit-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "Autorise les annonces Pro a l'unite sans abonnement"
          git push origin main
