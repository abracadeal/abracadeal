name: Repair HTTPS
on:
  push:
    paths:
      - '.github/workflows/diagnose-https.yml'
permissions:
  contents: read
  pages: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh GitHub Pages custom domain and HTTPS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Current Pages config ==="
          curl -sS             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             https://api.github.com/repos/abracadeal/abracadeal/pages | tee /tmp/pages-before.json
          echo
          echo "=== Refresh custom domain ==="
          curl -sS -X PUT             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             https://api.github.com/repos/abracadeal/abracadeal/pages             -d '{"cname":"abracadeal.fr"}' | tee /tmp/pages-domain.json || true
          echo
          sleep 5
          echo "=== Try enforce HTTPS ==="
          curl -sS -X PUT             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             https://api.github.com/repos/abracadeal/abracadeal/pages             -d '{"https_enforced":true}' | tee /tmp/pages-https.json || true
          echo
          echo "=== Final Pages config ==="
          curl -sS             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             https://api.github.com/repos/abracadeal/abracadeal/pages || true
          echo
          echo "=== HTTPS probe ==="
          curl -I -sS --max-time 15 https://abracadeal.fr || true
