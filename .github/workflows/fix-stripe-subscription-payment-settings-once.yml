name: Corriger parametre Stripe abonnement Pro

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-stripe-subscription-payment-settings-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Retirer parametre Checkout non supporte
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/create-pro-subscription-order/index.ts')
          t=p.read_text()
          bad='p.set("subscription_data[payment_settings][save_default_payment_method]","on_subscription");'
          if bad not in t:
              raise SystemExit('parametre Stripe introuvable')
          p.write_text(t.replace(bad,'',1))
          PY
      - name: Verification
        run: |
          ! grep -F 'subscription_data[payment_settings][save_default_payment_method]' supabase/functions/create-pro-subscription-order/index.ts
      - name: Commit et nettoyage
        run: |
          rm .github/workflows/fix-stripe-subscription-payment-settings-once.yml
          git config user.name "Abracadeal Bot"
          git config user.email "abracadeal@gmail.com"
          git add supabase/functions/create-pro-subscription-order/index.ts .github/workflows/fix-stripe-subscription-payment-settings-once.yml
          git commit -m "Corrige creation Checkout abonnement Pro"
          git push origin main
