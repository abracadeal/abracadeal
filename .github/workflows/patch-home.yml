name: Patch Abracadeal home
on:
  push:
    paths:
      - '.github/workflows/patch-home.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          # Keep the heavy banner image outside index.html.
          s, banner_replaced = re.subn(
            r'(<img\s+class="banner"\s+src=")data:image/png;base64,[^"]+(")',
            r'\1assets/abracadeal-brand-banner.png\2',
            s,
            count=1
          )

          replacements=[
            ("🏝 Abracadeal Vacances","🪔 Abracadeal Vacances"),
            ("🏖 Abracadeal Vacances","🪔 Abracadeal Vacances"),
            ("12 mois offerts, sans carte bancaire au démarrage.","12 mois offerts. La carte bancaire sera enregistrée lors de l’activation de l’offre."),
            ("Puis -10 % pendant 12 mois, avant le tarif public.",""),
            ("Puis –10 % pendant 12 mois, avant le tarif public.",""),
            ("Puis −10 % pendant 12 mois, avant le tarif public.",""),
            ("✓ -10 % la 2e année",""),
            ("✓ –10 % la 2e année",""),
            ("✓ Puis tarif public en vigueur",""),
            ("✓ Sans engagement automatique",""),
            ("Sans engagement automatique","Sans engagement"),
            ("Aucun abonnement imposé à la fin de l’offre.","Résiliable avant la fin de la période gratuite."),
          ]
          for a,b in replacements:
            s=s.replace(a,b)

          # Remove renewal-auto wording wherever it is purely promotional.
          s=re.sub(r"(?i)\s*[•·-]?\s*renouvellement automatique", "", s)
          s=re.sub(r"(?i)se renouvellent automatiquement[^<\.]*[\.]?", "", s)
          s=re.sub(r"(?i)renouvellement automatique[^<\.]*[\.]?", "", s)

          # Remove obvious year-2 discount snippets from the launch banners.
          s=re.sub(r"(?i)\s*Puis\s*[−–-]?10\s*%\s*pendant\s*12\s*mois\s*,?\s*avant\s*le\s*tarif\s*public\.?","",s)

          css='''<style id="abraca-home-ux-patch">
          .banner-frame{max-height:none!important;overflow:visible!important}
          .banner{display:block!important;width:100%!important;height:auto!important;max-height:none!important;object-fit:contain!important;object-position:center!important}
          .abraca-account-menu{position:relative;display:inline-block}
          .abraca-account-menu>button,.abraca-account-trigger{min-height:48px!important;padding:0 22px!important;border-radius:16px!important;border:1px solid rgba(255,218,130,.85)!important;background:linear-gradient(135deg,#4d176e 0%,#8f2aa8 48%,#ec3fa4 100%)!important;color:#fff!important;font:inherit!important;font-weight:900!important;cursor:pointer!important;box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 10px 28px rgba(210,55,173,.38),0 0 18px rgba(241,191,95,.18)!important;text-shadow:0 1px 0 rgba(0,0,0,.18)!important}
          .abraca-account-dropdown{position:absolute;right:0;top:calc(100% + 8px);min-width:190px;padding:8px;background:#251033;border:1px solid rgba(255,255,255,.14);border-radius:14px;box-shadow:0 18px 35px rgba(0,0,0,.28);z-index:9999;display:none}
          .abraca-account-menu.open .abraca-account-dropdown{display:grid;gap:6px}
          .abraca-account-dropdown button{width:100%;border:0;border-radius:10px;padding:10px 12px;text-align:left;background:rgba(255,255,255,.08);color:#fff;font-weight:750;cursor:pointer}
          .abraca-vacances-top{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:16px;background:linear-gradient(135deg,#7e24aa,#ec3fa4);color:#fff!important;font-weight:850;text-decoration:none!important;box-shadow:0 8px 18px rgba(126,36,170,.2)}
          @media(max-width:760px){
            html,body{overflow-x:hidden!important}
            .abraca-top-actions{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important;align-items:stretch!important;justify-items:stretch!important;width:100%!important;max-width:100%!important;box-sizing:border-box!important;padding:10px 12px 12px!important;margin:0!important}
            .abraca-account-menu{grid-column:1!important;grid-row:1!important;width:100%!important;min-width:0!important;max-width:none!important;position:relative!important;left:auto!important;right:auto!important;top:auto!important;bottom:auto!important;transform:none!important;float:none!important;margin:0!important;justify-self:stretch!important;box-sizing:border-box!important}
            .abraca-account-menu>button,.abraca-account-trigger{display:flex!important;align-items:center!important;justify-content:center!important;width:100%!important;min-width:0!important;max-width:none!important;min-height:46px!important;height:46px!important;padding:0 10px!important;margin:0!important;border-radius:14px!important;font-size:15px!important;line-height:1!important;white-space:nowrap!important;box-sizing:border-box!important;position:static!important;transform:none!important}
            .abraca-publish-top{grid-column:2!important;grid-row:1!important;width:100%!important;min-width:0!important;max-width:none!important;min-height:46px!important;height:46px!important;margin:0!important;padding:0 10px!important;border-radius:14px!important;font-size:15px!important;line-height:1!important;display:flex!important;align-items:center!important;justify-content:center!important;white-space:nowrap!important;box-sizing:border-box!important;position:static!important;left:auto!important;right:auto!important;top:auto!important;bottom:auto!important;transform:none!important;float:none!important;justify-self:stretch!important}
            .abraca-vacances-top{grid-column:1/-1!important;grid-row:2!important;width:100%!important;min-width:0!important;min-height:42px!important;height:42px!important;padding:0 12px!important;border-radius:13px!important;font-size:14px!important;line-height:1!important}
            .abraca-account-dropdown{left:0!important;right:auto!important;min-width:210px!important}
            .hero{padding-top:0!important}
            .banner-frame{margin:0!important}
            .banner-frame{max-height:140px!important;overflow:hidden!important}\n            .banner{display:block!important;width:100%!important;height:140px!important;max-height:140px!important;object-fit:cover!important;object-position:center!important}
            .search-wrap{position:relative!important;left:auto!important;bottom:auto!important;transform:none!important;width:calc(100% - 24px)!important;margin:12px auto 18px!important}
            .search-card{display:grid!important;grid-template-columns:1fr!important;gap:8px!important;padding:10px!important;border-radius:18px!important;box-shadow:0 12px 28px rgba(36,9,55,.18)!important}
            .field{min-height:48px!important;height:48px!important;padding:0 14px!important;border-radius:12px!important;font-size:16px!important}
            .search-btn,.search-nearby-btn{min-height:48px!important;height:48px!important;border-radius:12px!important;font-size:16px!important}
            .hero-shell::after{height:22px!important}
            .abraca-founder-mobile-card{margin:18px 12px!important;padding:22px 18px!important;border-radius:22px!important}
            .abraca-founder-mobile-title{font-size:clamp(31px,9vw,44px)!important;line-height:1.05!important;letter-spacing:-.025em!important;margin:8px 0 14px!important}
            .abraca-founder-mobile-card p,.abraca-founder-mobile-card li{font-size:16px!important;line-height:1.45!important}
          }
          @media(max-width:390px){
            .abraca-top-actions{grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;gap:8px!important;padding-left:10px!important;padding-right:10px!important}
            .abraca-account-menu>button,.abraca-account-trigger,.abraca-publish-top{font-size:14px!important;padding:0 8px!important}
            .abraca-vacances-top{font-size:13px!important;padding:0 8px!important}
            .banner{height:130px!important;max-height:130px!important}\n            .banner-frame{max-height:130px!important}
          }
          </style>'''
          if 'id="abraca-home-ux-patch"' in s:
            s=re.sub(r'<style id="abraca-home-ux-patch">[\s\S]*?</style>',lambda m: css,s,count=1)
          else:
            s=s.replace("</head>",css+"</head>")

          js=r'''<script id="abraca-home-ux-script">
          document.addEventListener('DOMContentLoaded',()=>{
            const all=[...document.querySelectorAll('a,button,div,span,strong,p,h1,h2,h3')];
            const exact=t=>all.filter(el=>(el.textContent||'').trim()===t);
            const visible=el=>!!(el.offsetWidth||el.offsetHeight||el.getClientRects().length);

            // One top-level "Compte" control containing both account actions.
            const create=exact('Créer un compte').find(visible);
            const login=exact('Se connecter').find(visible);
            if(create&&login&&create.parentElement===login.parentElement&&!document.querySelector('.abraca-account-menu')){
              const parent=create.parentElement;
              const menu=document.createElement('div'); menu.className='abraca-account-menu';
              const trigger=document.createElement('button'); trigger.type='button'; trigger.className='abraca-account-trigger'; trigger.textContent='Compte';
              const dd=document.createElement('div'); dd.className='abraca-account-dropdown';
              const c=document.createElement('button'); c.type='button'; c.textContent='Créer un compte'; c.onclick=()=>create.click();
              const l=document.createElement('button'); l.type='button'; l.textContent='Se connecter'; l.onclick=()=>login.click();
              dd.append(c,l); menu.append(trigger,dd);
              trigger.onclick=e=>{e.stopPropagation();menu.classList.toggle('open')};
              document.addEventListener('click',()=>menu.classList.remove('open'));
              parent.insertBefore(menu,create); create.style.display='none'; login.style.display='none';
            }

            // Normalize the top navigation: one Devenir hôte CTA only.
            const publish=exact('Publier une annonce').find(visible);
            if(publish&&publish.parentElement){
              const parent=publish.parentElement;
              parent.classList.add('abraca-top-actions');
              publish.classList.add('abraca-publish-top');
              publish.dataset.desktopLabel=(publish.textContent||'').trim();
              const syncPublishLabel=()=>{
                publish.textContent=window.innerWidth<=760?'Publier':(publish.dataset.desktopLabel||'Publier une annonce');
              };
              syncPublishLabel();
              window.addEventListener('resize',syncPublishLabel,{passive:true});
              [...parent.querySelectorAll('a,button')].forEach(el=>{
                if(el===publish) return;
                const t=(el.textContent||'').trim().toLowerCase();
                if(t.includes('vacances')||t==='devenir hôte'||t==='devenir hote'||el.classList.contains('abraca-vacances-top')){
                  el.remove();
                }
              });
              const a=document.createElement('a');
              a.href='espace-hote.html';
              a.className='abraca-vacances-top';
              a.textContent='Devenir hôte';
              const account=parent.querySelector('.abraca-account-menu');
              if(account) parent.insertBefore(a,account);
              else parent.insertBefore(a,publish);
            }

            // Compact the founder card on phones without changing desktop.
            const founderTitle=all.find(el=>{
              const t=(el.textContent||'').trim().replace(/\s+/g,' ');
              return /^Professionnels\s*:\s*démarrez avec 12 mois gratuits\.?$/i.test(t);
            });
            if(founderTitle){
              founderTitle.classList.add('abraca-founder-mobile-title');
              let card=founderTitle.parentElement;
              for(let i=0;i<3&&card&&card.parentElement;i++){
                const txt=(card.innerText||'').trim();
                if(txt.length<1600) card=card.parentElement; else break;
              }
              if(card&&card!==document.body) card.classList.add('abraca-founder-mobile-card');
            }

            // Hide the four large explanatory tiles in the founder banner.
            ['1re année','2e année','Ensuite','Sans engagement','Sans engagement automatique'].forEach(label=>{
              for(const el of exact(label)){
                let box=el;
                for(let i=0;i<4&&box.parentElement;i++){
                  const parent=box.parentElement;
                  const txt=(parent.innerText||'').trim();
                  if(txt.length<260){box=parent}else break;
                }
                if(box && box!==document.body) box.style.display='none';
              }
            });

            // Keep only the "12 mois offerts" small founder pill in the registration card.
            for(const el of all){
              const t=(el.textContent||'').trim();
              if((t.includes('-10 % la 2e année')||t.includes('–10 % la 2e année')||t.includes('Puis tarif public en vigueur')||t.includes('Sans engagement automatique'))&&t.length<90){
                el.style.display='none';
              }
            }

            // Put Pro/Pro CTA on the right.
            const pro=exact('Découvrez Pro/Pro').find(visible);
            const proBtn=all.find(el=>(el.textContent||'').trim().startsWith('Un espace dédié aux pros')&&visible(el));
            if(pro&&proBtn){
              let container=pro.parentElement;
              for(let i=0;i<4&&container;i++){
                if(container.contains(proBtn)){break}
                container=container.parentElement;
              }
              if(container){
                container.style.display='grid';
                container.style.gridTemplateColumns='minmax(0,1fr) auto';
                container.style.alignItems='center';
                container.style.gap='18px';
                proBtn.style.justifySelf='end';
              }
            }

            // Founder buttons now lead to plan selection/card registration after account setup.
            const founderButtons=[...document.querySelectorAll('a,button')].filter(el=>{
              const t=(el.textContent||'').trim().toLowerCase();
              return t==='créer un compte professionnel'||t==='profiter de l’offre fondateurs';
            });
            founderButtons.forEach((b,i)=>{
              if(i===0){
                b.addEventListener('click',e=>{
                  // Keep the existing account creation flow. The Stripe step is available after signup.
                  try{sessionStorage.setItem('abraca_founder_checkout_after_signup','1')}catch(_){}
                });
              }
            });
          });
          </script>'''
          if 'id="abraca-home-ux-script"' in s:
            s=re.sub(r'<script id="abraca-home-ux-script">[\s\S]*?</script>',lambda m: js,s,count=1)
          else:
            s=s.replace("</body>",js+"</body>")

          p.write_text(s,encoding="utf-8")
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "Abracadeal Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Align mobile account and publish buttons"
          git push
