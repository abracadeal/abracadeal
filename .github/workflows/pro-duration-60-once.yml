name: Harmoniser duree annonces Pro a 60 jours

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pro-duration-60-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Mettre 60 jours partout
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('pro-fondateur.html')
          s=p.read_text()
          old="function durationNote(o){if(o.code==='pro_autoimmo_single')return '<div class=\"note\">Pour publier ponctuellement sans abonnement ou au-delà des annonces de votre formule.</div>';if(o.code==='pro_boost_5')return '<div class=\"note\">5 boosts · crédits sans expiration</div>';return ''}"
          new="function durationNote(o){if(o.code==='pro_autoimmo_single')return '<div class=\"note\"><strong>Durée de publication : 60 jours</strong></div><div class=\"note\">Pour publier ponctuellement sans abonnement ou au-delà des annonces de votre formule.</div>';if(o.code==='pro_boost_5')return '<div class=\"note\">5 boosts · crédits sans expiration</div>';return ''}"
          if old not in s:
              raise SystemExit('Texte vignette attendu introuvable')
          p.write_text(s.replace(old,new,1))

          p=Path('aide.html')
          s=p.read_text()
          old='Auto / Moto : 60 jours. Immobilier : 90 jours.'
          new='Auto / Moto / Immobilier : 60 jours.'
          if old not in s:
              raise SystemExit('Texte duree FAQ attendu introuvable')
          s=s.replace(old,new,1)
          old_founder='12 mois gratuits sur les formules 20 ou 50 annonces, puis -50 % la deuxième année, puis tarif public.'
          new_founder='12 mois gratuits sur les formules 20 ou 50 annonces, puis tarif public normal à partir du 13e mois.'
          if old_founder in s:
              s=s.replace(old_founder,new_founder,1)
          p.write_text(s)
          PY

      - name: Verification
        run: |
          grep -F "Durée de publication : 60 jours" pro-fondateur.html
          grep -F "Auto / Moto / Immobilier : 60 jours." aide.html
          ! grep -F "Immobilier : 90 jours" aide.html

      - name: Commit et nettoyage
        run: |
          rm .github/workflows/pro-duration-60-once.yml
          git config user.name "Abracadeal Bot"
          git config user.email "abracadeal@gmail.com"
          git add pro-fondateur.html aide.html .github/workflows/pro-duration-60-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "Uniformise les annonces Pro a 60 jours"
          git push origin main
