name: Final pricing runtime cleanup
on:
  push:
    paths:
      - '.github/workflows/final-pricing-runtime.yml'
      - '.github/final_pricing_runtime_patch.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/final_pricing_runtime_patch.py
      - name: Verify
        run: |
          ! grep -q 'Tarification hôte en cours de refonte' vacances.html espace-hote.html
          ! grep -q 'tarification Hôte est en cours de refonte' assets/espace-hote.js
          grep -q '4,99 € TTC' vacances.html
          grep -q 'create-vacation-billing-portal' assets/espace-hote.js
          grep -q 'proPlanPhotoLimit' assets/index-main.js
          grep -q 'options-annonce.html' assets/index-main.js
          ! grep -Eq '49 € HT|99 € HT' vacances.html
      - name: Commit
        run: |
          git config user.name abracadeal-bot
          git config user.email abracadeal@gmail.com
          git add vacances.html espace-hote.html assets/espace-hote.js assets/index-main.js
          git commit -m 'Finalise les tarifs Vacances et les quotas photos'
          git push
