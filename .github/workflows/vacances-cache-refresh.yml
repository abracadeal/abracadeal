name: Vacances CSS cache refresh

on:
  push:
    paths:
      - '.github/workflows/vacances-cache-refresh.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh Vacances stylesheet version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('vacances.html')
          s=p.read_text()
          old='assets/vacances-ui.css?v=20261001-1'
          new='assets/vacances-ui.css?v=20261005-bg2'
          if old not in s:
              raise SystemExit('ancienne version CSS introuvable')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit change
        shell: bash
        run: |
          git config user.name 'abracadeal'
          git config user.email 'abracadeal@gmail.com'
          git add vacances.html
          git diff --cached --quiet || git commit -m 'Force le rafraichissement du fond Vacances'
          git push
