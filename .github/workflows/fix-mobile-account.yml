name: Fix mobile account button
on:
  push:
    paths:
      - '.github/workflows/fix-mobile-account.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mobile account/header
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          # Remove the previous floating bar experiment.
          s=re.sub(r'<style id="abraca-mobile-floating-actions-fix">[\s\S]*?</style>','',s,count=1)
          s=re.sub(r'<script id="abraca-mobile-floating-actions-script">[\s\S]*?</script>','',s,count=1)

          # On mobile, keep the real account button instead of generating a second menu.
          s=s.replace(
            "if(create&&login&&create.parentElement===login.parentElement&&!document.querySelector('.abraca-account-menu')){",
            "if(window.innerWidth>760&&create&&login&&create.parentElement===login.parentElement&&!document.querySelector('.abraca-account-menu')){",
            1
          )

          # Avoid invalid insertBefore on a nested account-menu node.
          s=s.replace(
            "const account=parent.querySelector('.abraca-account-menu');\n    if(account) parent.insertBefore(a,account);\n    else parent.insertBefore(a,publish);",
            "parent.insertBefore(a,publish);",
            1
          )

          css=r'''<style id="abraca-mobile-account-real-button">
          @media(max-width:760px){
            header{
              position:sticky!important;
              top:0!important;
              z-index:10000!important;
            }
            header .nav{
              min-height:0!important;
              padding:8px 10px 10px!important;
              box-sizing:border-box!important;
            }
            header .nav-actions,
            header .abraca-top-actions{
              display:grid!important;
              grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;
              gap:8px!important;
              align-items:stretch!important;
              width:100%!important;
              max-width:100%!important;
              margin:0!important;
              padding:0!important;
              box-sizing:border-box!important;
            }
            header .account-auth-group{
              display:block!important;
              grid-column:1!important;
              grid-row:1!important;
              width:100%!important;
              min-width:0!important;
              border-radius:14px!important;
              overflow:visible!important;
              box-shadow:none!important;
            }
            header #signupBtn{
              display:none!important;
            }
            header #accountBtn{
              display:flex!important;
              align-items:center!important;
              justify-content:center!important;
              width:100%!important;
              min-width:0!important;
              max-width:none!important;
              height:46px!important;
              min-height:46px!important;
              margin:0!important;
              padding:0 10px!important;
              border-radius:14px!important;
              box-sizing:border-box!important;
              position:static!important;
              inset:auto!important;
              transform:none!important;
              float:none!important;
              font-size:0!important;
              color:#fff!important;
              background:linear-gradient(135deg,#4d176e 0%,#8f2aa8 48%,#ec3fa4 100%)!important;
              border:1px solid rgba(255,218,130,.85)!important;
              box-shadow:0 10px 28px rgba(210,55,173,.30)!important;
            }
            header #accountBtn::after{
              content:"Compte";
              font-size:15px!important;
              line-height:1!important;
              font-weight:900!important;
              color:#fff!important;
            }
            header .abraca-account-menu{
              display:none!important;
            }
            header .publish-trigger,
            header .abraca-publish-top{
              grid-column:2!important;
              grid-row:1!important;
              display:flex!important;
              align-items:center!important;
              justify-content:center!important;
              width:100%!important;
              min-width:0!important;
              max-width:none!important;
              height:46px!important;
              min-height:46px!important;
              margin:0!important;
              padding:0 10px!important;
              border-radius:14px!important;
              box-sizing:border-box!important;
              position:static!important;
              inset:auto!important;
              transform:none!important;
              float:none!important;
              white-space:nowrap!important;
              font-size:15px!important;
            }
            header .abraca-vacances-top{
              grid-column:1/-1!important;
              grid-row:2!important;
              width:100%!important;
              min-height:42px!important;
              height:42px!important;
              margin:0!important;
            }
          }
          @media(max-width:390px){
            header #accountBtn::after,
            header .publish-trigger,
            header .abraca-publish-top{
              font-size:14px!important;
            }
          }
          </style>'''

          if 'id="abraca-mobile-account-real-button"' in s:
              s=re.sub(r'<style id="abraca-mobile-account-real-button">[\s\S]*?</style>',lambda m:css,s,count=1)
          else:
              s=s.replace("</head>",css+"</head>")

          p.write_text(s,encoding="utf-8")
          PY
      - name: Commit fix
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "Abracadeal Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Fix real mobile account button and sticky header"
          git push
