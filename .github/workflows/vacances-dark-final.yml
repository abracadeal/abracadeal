name: Vacances dark final

on:
  push:
    paths:
      - '.github/workflows/vacances-dark-final.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/patch_vac_bg.py
      - name: Commit
        run: |
          git config user.name 'abracadeal'
          git config user.email 'abracadeal@gmail.com'
          git add assets/vacances-ui.css vacances.html
          git diff --cached --quiet || git commit -m 'Passe Vacances sur le fond sombre de accueil'
          git push
