name: Vacances dark background

on:
  push:
    paths:
      - '.github/workflows/vacances-dark-bg.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match Vacances to main dark background
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          css=Path('assets/vacances-ui.css')
          s=css.read_text()
          old='''/* VACANCES_BG_MATCH_MAIN_20261005 */
:root{--paper:#faf7fd}
body,#vacTravelerMain{background:#faf7fd!important}
#vacTravelerMain .section,#vacTravelerMain .section.alt,#vacTravelerMain .owner{background:#faf7fd!important}
@media(max-width:760px){
  body,#vacTravelerMain{background:#faf7fd!important}
  #vacTravelerMain .hero{background:transparent!important}
}'''
          new='''/* VACANCES_BG_MATCH_MAIN_20261005 */
:root{--vac-main-dark:#1b0d2d;--vac-main-dark2:#211038;--vac-main-dark3:#2a1244}
body,#vacTravelerMain{
  background:
    radial-gradient(70% 110% at 50% 0%,rgba(100,39,142,.42),transparent 65%),
    linear-gradient(180deg,var(--vac-main-dark) 0%,var(--vac-main-dark2) 68%,var(--vac-main-dark3) 100%)!important;
}
.topbar{
  background:rgba(27,13,45,.96)!important;
  border-bottom:1px solid rgba(255,255,255,.08)!important;
  box-shadow:0 8px 24px rgba(0,0,0,.18)!important;
}
.topbar .brand,.topbar .brand small,.topbar .nav-actions .btn{color:#fff!important}
#vacTravelerMain .section,#vacTravelerMain .section.alt,#vacTravelerMain .owner{
  background:transparent!important;
  border-color:rgba(255,255,255,.08)!important;
}
#vacTravelerMain .section-head h2,#vacTravelerMain .section-head p,#vacTravelerMain .owner h2,#vacTravelerMain .owner>div>h2{color:#fff!important}
@media(max-width:760px){
  body,#vacTravelerMain{
    background:linear-gradient(180deg,#1b0d2d 0%,#211038 68%,#2a1244 100%)!important;
  }
  .topbar{background:rgba(27,13,45,.98)!important}
  #vacTravelerMain .hero{background:transparent!important}
}'''
          if old not in s:
              raise SystemExit('ancien bloc fond Vacances introuvable')
          css.write_text(s.replace(old,new,1))

          html=Path('vacances.html')
          h=html.read_text()
          h=h.replace('assets/vacances-ui.css?v=20261005-bg2','assets/vacances-ui.css?v=20261005-dark1',1)
          html.write_text(h)
          PY
      - name: Commit change
        shell: bash
        run: |
          git config user.name 'abracadeal'
          git config user.email 'abracadeal@gmail.com'
          git add assets/vacances-ui.css vacances.html
          git diff --cached --quiet || git commit -m 'Passe le fond Vacances en violet sombre comme accueil'
          git push
