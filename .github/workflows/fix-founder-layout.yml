name: Fix founder layout once

on:
  push:
    branches:
      - tmp-founder-fix
    paths:
      - '.github/workflows/fix-founder-layout.yml'
      - '.github/fix_founder_layout.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: tmp-founder-fix
      - name: Apply patch
        run: python .github/fix_founder_layout.py
      - name: Commit patched index
        run: |
          if git diff --quiet -- index.html; then
            echo "No index change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Place founder offer only in professional signup"
          git push origin HEAD:tmp-founder-fix
