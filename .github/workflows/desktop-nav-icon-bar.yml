name: Desktop nav icon bar
on:
  push:
    paths:
      - '.github/workflows/desktop-nav-icon-bar.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop icon navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          css = r'''<style id="abraca-desktop-icon-nav-patch">
          @media (min-width:1024px){
            header .nav{
              grid-template-columns:minmax(170px,1fr) auto!important;
              grid-template-areas:
                "brand actions"
                "cats cats"!important;
              row-gap:0!important;
              min-height:0!important;
              padding-top:2px!important;
              padding-bottom:0!important;
            }
            header .desktop-brand{grid-area:brand!important}
            header .nav-actions{
              grid-area:actions!important;
              display:flex!important;
              align-items:center!important;
              justify-content:flex-end!important;
              min-width:0!important;
              gap:0!important;
            }
            header .desktop-category-nav{
              grid-area:cats!important;
              width:100%!important;
              justify-content:center!important;
              gap:10px!important;
              min-height:32px!important;
              margin-top:-8px!important;
              margin-bottom:-1px!important;
              padding-top:0!important;
              padding-bottom:0!important;
              align-items:center!important;
              overflow:visible!important;
              position:relative!important;
              z-index:120!important;
            }
            header,
            header .nav{
              overflow:visible!important;
            }
            header .desktop-nav-item{
              position:relative!important;
              z-index:121!important;
            }
            header .desktop-submenu{
              z-index:15000!important;
            }
            header .desktop-category-link{
              min-height:32px!important;
              height:32px!important;
              padding-top:0!important;
              padding-bottom:0!important;
              padding-left:9px!important;
              padding-right:9px!important;
              line-height:32px!important;
              display:flex!important;
              align-items:center!important;
              justify-content:center!important;
            }

            /* Remplace visuellement l'ancien bloc d'actions desktop sans supprimer ses triggers JS. */
            header .nav-actions > :not(.abraca-desktop-actions-v2){
              display:none!important;
            }

            .abraca-desktop-actions-v2{
              display:flex!important;
              align-items:center!important;
              justify-content:flex-end!important;
              gap:4px!important;
              min-height:48px!important;
              white-space:nowrap!important;
            }
            .abraca-desktop-actions-v2 .abraca-dnav-item{
              position:relative!important;
              min-width:72px!important;
              height:46px!important;
              padding:4px 9px 3px!important;
              border:0!important;
              border-radius:12px!important;
              background:transparent!important;
              color:#f6eef9!important;
              display:flex!important;
              flex-direction:column!important;
              align-items:center!important;
              justify-content:center!important;
              gap:3px!important;
              font-family:'DM Sans',sans-serif!important;
              font-size:11px!important;
              line-height:1!important;
              font-weight:700!important;
              text-decoration:none!important;
              cursor:pointer!important;
              transition:background .15s ease,color .15s ease,transform .15s ease!important;
            }
            .abraca-desktop-actions-v2 .abraca-dnav-item:hover{
              background:rgba(255,255,255,.075)!important;
              color:#fff!important;
              transform:translateY(-1px)!important;
            }
            .abraca-desktop-actions-v2 .abraca-dnav-item svg{
              width:24px!important;
              height:24px!important;
              display:block!important;
              fill:none!important;
              stroke:currentColor!important;
              stroke-width:1.9!important;
              stroke-linecap:round!important;
              stroke-linejoin:round!important;
              flex:0 0 auto!important;
            }
            .abraca-desktop-actions-v2 .abraca-dnav-search{
              min-width:54px!important;
              width:54px!important;
              height:48px!important;
              margin-right:5px!important;
              padding:0!important;
              border-radius:14px!important;
              background:linear-gradient(135deg,#f15b45 0%,#ec409d 100%)!important;
              color:#fff!important;
              box-shadow:0 8px 20px rgba(236,64,157,.24)!important;
            }
            .abraca-desktop-actions-v2 .abraca-dnav-search svg{
              width:23px!important;
              height:23px!important;
            }
            .abraca-desktop-actions-v2 .abraca-dnav-search span{
              display:none!important;
            }
            .abraca-desktop-actions-v2 .abraca-dnav-vacances{
              color:#f3cf70!important;
            }
            .abraca-desktop-actions-v2 .abraca-dnav-vacances::after{
              content:""!important;
              position:absolute!important;
              left:13px!important;
              right:13px!important;
              bottom:0!important;
              height:2px!important;
              border-radius:999px!important;
              background:linear-gradient(90deg,#f3cf70,#ec409d)!important;
            }
            .abraca-desktop-actions-v2 .abraca-dnav-badge{
              position:absolute!important;
              top:2px!important;
              right:14px!important;
              min-width:17px!important;
              height:17px!important;
              padding:0 4px!important;
              border-radius:999px!important;
              display:flex!important;
              align-items:center!important;
              justify-content:center!important;
              background:#ec409d!important;
              color:#fff!important;
              border:2px solid #1b0d2d!important;
              font-size:9px!important;
              line-height:1!important;
              font-weight:900!important;
            }
            .abraca-desktop-actions-v2 .abraca-dnav-badge:empty{
              display:none!important;
            }
          }
          @media (min-width:1024px) and (max-width:1180px){
            .abraca-desktop-actions-v2{gap:0!important}
            .abraca-desktop-actions-v2 .abraca-dnav-item{
              min-width:64px!important;
              padding-left:6px!important;
              padding-right:6px!important;
              font-size:10px!important;
            }
            .abraca-desktop-actions-v2 .abraca-dnav-search{
              min-width:48px!important;
              width:48px!important;
            }
          }
          </style>'''

          js = r'''<script id="abraca-desktop-icon-nav-script">
          (() => {
            const icon = {
              search:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>',
              vacations:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17h16"></path><path d="M7 17c1.2-3.4 2.9-5.4 5-6"></path><path d="M12 11c2.3.3 4.2 1.6 5.5 4"></path><path d="M12 11V5"></path><path d="M9 7c1.1-1.5 2-2.2 3-2"></path><path d="M15 7c-1.1-1.5-2-2.2-3-2"></path></svg>',
              heart:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.8a5.3 5.3 0 0 0-7.5 0L12 6.1l-1.3-1.3a5.3 5.3 0 1 0-7.5 7.5L12 21l8.8-8.7a5.3 5.3 0 0 0 0-7.5Z"></path></svg>',
              messages:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4Z"></path><path d="M8 9h8M8 13h5"></path></svg>',
              account:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4.5 21a7.5 7.5 0 0 1 15 0"></path></svg>'
            };

            function visibleDesktop(){
              return window.matchMedia('(min-width:1024px)').matches;
            }
            function original(sel){
              return document.querySelector(sel);
            }
            function clickOriginal(selectors){
              for(const sel of selectors){
                const el=original(sel);
                if(el){
                  try{ el.click(); return true; }catch(_){}
                }
              }
              return false;
            }
            function openModal(id){
              const modal=document.getElementById(id);
              if(!modal) return false;
              modal.removeAttribute('hidden');
              modal.setAttribute('aria-hidden','false');
              modal.classList.add('show','open','active');
              if(getComputedStyle(modal).display==='none') modal.style.display='flex';
              return true;
            }
            function make(tag, cls, label, svg){
              const el=document.createElement(tag);
              if(tag==='button') el.type='button';
              el.className='abraca-dnav-item '+cls;
              el.setAttribute('aria-label',label);
              el.innerHTML=svg+'<span>'+label+'</span>';
              return el;
            }

            function syncBadge(){
              const target=document.querySelector('.abraca-desktop-actions-v2 .abraca-dnav-messages .abraca-dnav-badge');
              if(!target) return;
              const source=document.querySelector('#accountBtn .account-unread-badge, #headerMessagesBtn .unread-badge, .messages-unread-badge');
              const txt=source && !source.classList.contains('hidden') ? (source.textContent||'').trim() : '';
              target.textContent=txt;
            }

            function cleanupLegacyDesktopActions(){
              document.querySelectorAll('header .header-vacances-btn, header .abraca-vacances-top').forEach(el=>el.remove());
            }

            function build(){
              if(!visibleDesktop()) return;
              cleanupLegacyDesktopActions();
              const actions=document.querySelector('header .nav-actions');
              if(!actions || actions.querySelector('.abraca-desktop-actions-v2')){ syncBadge(); return; }

              const bar=document.createElement('nav');
              bar.className='abraca-desktop-actions-v2';
              bar.setAttribute('aria-label','Navigation rapide');

              const vac=make('a','abraca-dnav-vacances','Vacances',icon.vacations);
              vac.href='vacances.html';

              const fav=make('button','abraca-dnav-favorites','Favoris',icon.heart);
              fav.addEventListener('click',()=>{
                if(!clickOriginal(['.desktop-favorites-btn','#favoritesBtn','#headerFavoritesBtn'])){
                  const target=[...document.querySelectorAll('button,a')].find(el=>/favoris/i.test((el.getAttribute('aria-label')||'')+' '+(el.textContent||'')) && !el.closest('.abraca-desktop-actions-v2'));
                  if(target) try{target.click()}catch(_){}
                }
              });

              const msg=make('button','abraca-dnav-messages','Messages',icon.messages);
              const badge=document.createElement('i');
              badge.className='abraca-dnav-badge';
              badge.setAttribute('aria-hidden','true');
              msg.appendChild(badge);
              msg.addEventListener('click',()=>{
                if(!clickOriginal(['#headerMessagesBtn','#messagesBtn','.header-messages-btn'])) openModal('messagesModal');
              });

              const acct=make('button','abraca-dnav-account','Compte',icon.account);
              acct.addEventListener('click',()=>{
                if(!clickOriginal(['#accountBtn','.abraca-account-trigger','#loginBtn','#signupBtn'])) openModal('accountModal');
              });

              bar.append(vac,fav,msg,acct);
              actions.appendChild(bar);
              syncBadge();

              const source=document.querySelector('#accountBtn .account-unread-badge, #headerMessagesBtn .unread-badge, .messages-unread-badge');
              if(source && window.MutationObserver){
                new MutationObserver(syncBadge).observe(source,{subtree:true,childList:true,attributes:true,characterData:true});
              }
            }

            const start=()=>{
              build();
              requestAnimationFrame(build);
              setTimeout(build,120);
              setTimeout(build,700);
              const header=document.querySelector('header');
              if(header && window.MutationObserver){
                new MutationObserver(()=>cleanupLegacyDesktopActions()).observe(header,{childList:true,subtree:true});
              }
            };
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start,{once:true});
            else start();
            window.addEventListener('resize',build,{passive:true});
          })();
          </script>'''

          if 'id="abraca-desktop-icon-nav-patch"' in s:
              s = re.sub(r'<style id="abraca-desktop-icon-nav-patch">[\s\S]*?</style>', css, s, count=1)
          else:
              s = s.replace("</head>", css + "\n</head>", 1)

          if 'id="abraca-desktop-icon-nav-script"' in s:
              s = re.sub(r'<script id="abraca-desktop-icon-nav-script">[\s\S]*?</script>', js, s, count=1)
          else:
              s = s.replace("</body>", js + "\n</body>", 1)

          p.write_text(s, encoding="utf-8")
          PY

      - name: Commit desktop navigation
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "Abracadeal Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Desktop: espacer davantage et centrer verticalement les categories"
          git push
