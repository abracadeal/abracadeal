name: Corriger affichage et facturation Fondateur annee 2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-founder-year2-checkout-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Corriger Checkout Fondateur et planning Stripe
        run: |
          python - <<'PY'
          from pathlib import Path

          order = Path('supabase/functions/create-pro-subscription-order/index.ts')
          s = order.read_text()

          anchor = 'async function ensureRecurringPrice(plan:any){let priceId=String(plan?.stripe_price_id||"");if(priceId.startsWith("pending_")||!priceId.startsWith("price_")){const p=new URLSearchParams();p.set("currency","eur");p.set("unit_amount",String(plan.amount_cents));p.set("recurring[interval]","month");p.set("product_data[name]",String(plan.label));p.set("product_data[metadata][abraca_plan_code]",String(plan.code));p.set("metadata[abraca_plan_code]",String(plan.code));const created=await stripePost("prices",p);priceId=String(created.id);await admin.from("pro_subscription_plans").update({stripe_price_id:priceId,updated_at:new Date().toISOString()}).eq("code",plan.code);await admin.from("commerce_offers").update({stripe_price_id:priceId,updated_at:new Date().toISOString()}).eq("code",plan.code);plan.stripe_price_id=priceId}return priceId}\n'
          helper = '''async function ensureFounderYear2Price(plan:any){const lookup=`abraca_founder_y2_${String(plan.code)}`;const amount=Math.round(Number(plan.amount_cents)*0.5);const found=await stripeGet("prices?active=true&limit=10&lookup_keys[]="+encodeURIComponent(lookup));const existing=(found?.data||[]).find((x:any)=>x?.active===true&&x?.currency==='eur'&&x?.type==='recurring'&&x?.recurring?.interval==='month'&&Number(x?.unit_amount)===amount);if(existing)return String(existing.id);const p=new URLSearchParams();p.set("currency","eur");p.set("unit_amount",String(amount));p.set("recurring[interval]","month");p.set("lookup_key",lookup);p.set("product_data[name]",`Fondateur ${String(plan.label)} — 2e année -50 %`);p.set("product_data[metadata][abraca_plan_code]",String(plan.code));p.set("product_data[metadata][abraca_founder_year2]","1");p.set("metadata[abraca_plan_code]",String(plan.code));p.set("metadata[abraca_founder_year2]","1");const created=await stripePost("prices",p);return String(created.id)}\n'''
          if 'async function ensureFounderYear2Price' not in s:
              if anchor not in s: raise SystemExit('anchor ensureRecurringPrice introuvable')
              s=s.replace(anchor,anchor+helper,1)

          old='const methods=await paymentMethods();const p=new URLSearchParams();p.set("mode","subscription");p.set("line_items[0][price]",priceId);'
          new='const methods=await paymentMethods();const checkoutPriceId=founderFree?await ensureFounderYear2Price(plan):priceId;const p=new URLSearchParams();p.set("mode","subscription");p.set("line_items[0][price]",checkoutPriceId);'
          if old not in s: raise SystemExit('ligne checkout price introuvable')
          s=s.replace(old,new,1)
          order.write_text(s)

          hook = Path('supabase/functions/stripe-pricing-v2-webhook/index.ts')
          h = hook.read_text()
          start = h.index("const FOUNDER_Y2_COUPON=")
          end = h.index("// Activation d'une option payee", start)
          replacement = '''async function ensureFounderSchedule(subscription:any,founderPriceId:string,publicPriceId:string,freeUntil:string,discountUntil:string){if(subscription.schedule)return subscription.schedule;const freeEnd=Math.floor(new Date(freeUntil).getTime()/1000),discountEnd=Math.floor(new Date(discountUntil).getTime()/1000);if(!(discountEnd>freeEnd))throw new Error("Fenêtre Fondateur invalide");const init=new URLSearchParams({from_subscription:String(subscription.id)});const schedule=await stripe("subscription_schedules",init);const phase=new URLSearchParams();phase.set("end_behavior","release");phase.set("proration_behavior","none");phase.set("phases[0][items][0][price]",founderPriceId);phase.set("phases[0][items][0][quantity]","1");phase.set("phases[0][start_date]",String(schedule.current_phase?.start_date||subscription.current_period_start||Math.floor(Date.now()/1000)));phase.set("phases[0][end_date]",String(freeEnd));phase.set("phases[0][trial_end]",String(freeEnd));phase.set("phases[0][proration_behavior]","none");phase.set("phases[1][items][0][price]",founderPriceId);phase.set("phases[1][items][0][quantity]","1");phase.set("phases[1][start_date]",String(freeEnd));phase.set("phases[1][end_date]",String(discountEnd));phase.set("phases[1][proration_behavior]","none");phase.set("phases[2][items][0][price]",publicPriceId);phase.set("phases[2][items][0][quantity]","1");phase.set("phases[2][start_date]",String(discountEnd));phase.set("phases[2][iterations]","1");phase.set("phases[2][proration_behavior]","none");await stripe("subscription_schedules/"+encodeURIComponent(schedule.id),phase);return schedule.id}\n'''
          h=h[:start]+replacement+h[end:]

          oldv='const sub=await stripe("subscriptions/"+encodeURIComponent(subId));if(sub.items?.data?.length!==1||sub.items.data[0]?.price?.id!==plan.stripe_price_id||Number(sub.items.data[0]?.quantity||1)!==1)return json({error:"Tarif Pro Stripe incohérent"},400);const isFounder=order.founder_number!==null;'
          newv='const sub=await stripe("subscriptions/"+encodeURIComponent(subId));const isFounder=order.founder_number!==null;const subItem=sub.items?.data?.[0];const subPrice=subItem?.price;if(sub.items?.data?.length!==1||Number(subItem?.quantity||1)!==1)return json({error:"Tarif Pro Stripe incohérent"},400);if(isFounder){if(Number(subPrice?.unit_amount)!==Math.round(Number(plan.amount_cents)*0.5)||String(subPrice?.currency||"")!=="eur"||String(subPrice?.type||"")!=="recurring"||String(subPrice?.recurring?.interval||"")!=="month")return json({error:"Tarif Fondateur année 2 incohérent"},400)}else if(subPrice?.id!==plan.stripe_price_id)return json({error:"Tarif Pro Stripe incohérent"},400);'
          if oldv not in h: raise SystemExit('validation webhook introuvable')
          h=h.replace(oldv,newv,1)

          oldcall='scheduleId=await ensureFounderSchedule(sub,String(plan.stripe_price_id),String(founder.free_until),String(founder.discount_until))'
          newcall='scheduleId=await ensureFounderSchedule(sub,String(subPrice.id),String(plan.stripe_price_id),String(founder.free_until),String(founder.discount_until))'
          if oldcall not in h: raise SystemExit('appel schedule introuvable')
          h=h.replace(oldcall,newcall,1)
          hook.write_text(h)
          PY

      - name: Verifications
        run: |
          grep -F 'ensureFounderYear2Price' supabase/functions/create-pro-subscription-order/index.ts
          grep -F 'checkoutPriceId=founderFree?' supabase/functions/create-pro-subscription-order/index.ts
          grep -F 'Tarif Fondateur année 2 incohérent' supabase/functions/stripe-pricing-v2-webhook/index.ts
          grep -F 'ensureFounderSchedule(sub,String(subPrice.id),String(plan.stripe_price_id)' supabase/functions/stripe-pricing-v2-webhook/index.ts

      - name: Commit et nettoyage
        run: |
          rm .github/workflows/fix-founder-year2-checkout-once.yml
          git config user.name "Abracadeal Bot"
          git config user.email "abracadeal@gmail.com"
          git add supabase/functions/create-pro-subscription-order/index.ts supabase/functions/stripe-pricing-v2-webhook/index.ts .github/workflows/fix-founder-year2-checkout-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "Corrige offre Fondateur annee 2 a moins 50 pourcent"
          git push origin main
