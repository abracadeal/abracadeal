name: Final category labels
on:
  push:
    paths:
      - '.github/workflows/final-category-labels.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch labels
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(); before=s
          s=s.replace('data-category="maison" data-sub="bricolage">Bricolage</a>','data-category="maison" data-sub="bricolage">Bricolage &amp; Matériel</a>')
          audio='<a class="desktop-subcategory-link category-link" href="#resultats" data-category="hightech" data-sub="audio">Audio</a>'
          instrument='<a class="desktop-subcategory-link category-link" href="#resultats" data-category="hightech" data-sub="instruments-musique">Instruments de musique</a>'
          if audio in s and instrument not in s:s=s.replace(audio,audio+'\n          '+instrument,1)
          s=s.replace('data-category="emploi">Emploi &amp; Services</a>','data-category="emploi">Emploi / Services &amp; Artisans</a>')
          p.write_text(s)
          if s==before: raise SystemExit('Aucun libellé modifié')
      - name: Verify
        run: |
          grep -q 'Bricolage &amp; Matériel' index.html
          grep -q 'instruments-musique">Instruments de musique' index.html
      - name: Commit
        run: |
          git config user.name "abracadeal-bot"
          git config user.email "abracadeal@gmail.com"
          git add index.html
          git commit -m "Aligne Maison, High-tech et Services"
          git push
