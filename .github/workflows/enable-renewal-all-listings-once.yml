name: Activer prolongation 60 jours toutes annonces

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/enable-renewal-all-listings-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Etendre la prolongation aux Pros hors Vacances
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('assets/index-main.js')
          s=p.read_text()
          old="return a.seller_type==='particulier'&&a.category!=='vacances'&&!a.revision_of&&a.expires_at&&new Date(a.expires_at).getTime()<=Date.now()+7*86400000&&(a.status==='active'||(a.status==='archived'&&a.archive_reason==='expired'));"
          new="return ['particulier','professionnel'].includes(a.seller_type)&&a.category!=='vacances'&&!a.revision_of&&a.expires_at&&new Date(a.expires_at).getTime()<=Date.now()+7*86400000&&(a.status==='active'||(a.status==='archived'&&a.archive_reason==='expired'));"
          if s.count(old)!=1: raise SystemExit(f'condition renouvellement inattendue: {s.count(old)}')
          p.write_text(s.replace(old,new,1))

          p=Path('aide.html')
          s=p.read_text()
          s=s.replace('Auto / Moto / Immobilier : 60 jours.','Toutes les annonces professionnelles hors Vacances : 60 jours. La prolongation gratuite de 60 jours est disponible dans les 7 derniers jours, sans remontée.')
          p.write_text(s)

          for name in ['cgu.html','index.html']:
            p=Path(name)
            s=p.read_text()
            s=s.replace('Le particulier peut prolonger gratuitement son annonce de 60 jours depuis « Mes annonces », dans les 7 derniers jours ou après expiration, sans modifier sa date de classement.','Le particulier ou le professionnel peut prolonger gratuitement son annonce de 60 jours depuis « Mes annonces », dans les 7 derniers jours ou après expiration, sans modifier sa date de classement.')
            p.write_text(s)
          PY

      - name: Verifications
        run: |
          grep -F "['particulier','professionnel'].includes(a.seller_type)" assets/index-main.js
          grep -F "Toutes les annonces professionnelles hors Vacances : 60 jours" aide.html

      - name: Commit et nettoyage
        run: |
          rm .github/workflows/enable-renewal-all-listings-once.yml
          git config user.name "Abracadeal Bot"
          git config user.email "abracadeal@gmail.com"
          git add assets/index-main.js aide.html cgu.html index.html .github/workflows/enable-renewal-all-listings-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "Active la prolongation 60 jours pour toutes les annonces hors Vacances"
          git push origin main
