name: Fix Pro pricing sector gate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-pro-pricing-sector-gate-v2.yml
      - .github/scripts/fix_pro_pricing_sector_gate.py

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python .github/scripts/fix_pro_pricing_sector_gate.py
      - run: |
          grep -F "showSectorChoice" pro-fondateur.html
          grep -F "adaptSectorPage" pro-fondateur.html
      - run: |
          git config user.name "Abracadeal Bot"
          git config user.email "abracadeal@gmail.com"
          git add pro-fondateur.html
          git diff --cached --quiet && exit 0
          git commit -m "Corrige page Pro selon le domaine"
          git push origin main
