name: Corriger verification Pro avant abonnement

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-pro-verification-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Corriger verification Pro
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('pro-fondateur.html')
          t=p.read_text()
          old="async function buy(o,listingId=null){if(o.code==='pro_250'||o.metadata?.quote_only===true){requestQuote();return}try{const isOption=['featured','urgent','boost_pack','photo_option'].includes(o.offer_type);if(isOption&&!await confirmOptionPurchase())return;showPaymentLoading();let d;if(o.recurring){d=await callFunction(o.category_group==='vacances'?'create-vacation-subscription-order':'create-pro-subscription-order',{plan_code:o.code,...(((o.code==='pro_20'||o.code==='pro_50')&&founderOpen()&&(!mySub||mySub.founder_number!=null))?{expect_founder:true}:{})})}else d=await callFunction('create-commerce-order',{offer_code:o.code,...(isOption?{withdrawal_accepted:true}:{}),...(listingId?{listing_id:listingId}:{})});if(d.checkout_url)location.href=d.checkout_url;else throw new Error('Paiement indisponible')}catch(e){hidePaymentLoading();alert(e.message||'Action impossible')}}"
          new="async function buy(o,listingId=null){if(o.code==='pro_250'||o.metadata?.quote_only===true){requestQuote();return}try{const isOption=['featured','urgent','boost_pack','photo_option'].includes(o.offer_type);if(isOption&&!await confirmOptionPurchase())return;showPaymentLoading();let d;if(o.recurring){const {data:{session}}=await sb.auth.getSession();const siret=String(session?.user?.user_metadata?.company_registration?.siret||'').replace(/\\D/g,'');if(siret){const vr=await sb.functions.invoke('verify-professional',{body:{action:'verify',siret}});if(vr.error){let detail=null;try{detail=await vr.error.context?.json()}catch(_){}throw new Error(detail?.error||vr.error.message||'Impossible de vérifier le SIRET')}}d=await callFunction(o.category_group==='vacances'?'create-vacation-subscription-order':'create-pro-subscription-order',{plan_code:o.code,...(((o.code==='pro_20'||o.code==='pro_50')&&founderOpen()&&(!mySub||mySub.founder_number!=null))?{expect_founder:true}:{})})}else d=await callFunction('create-commerce-order',{offer_code:o.code,...(isOption?{withdrawal_accepted:true}:{}),...(listingId?{listing_id:listingId}:{})});if(d.checkout_url)location.href=d.checkout_url;else throw new Error('Paiement indisponible')}catch(e){hidePaymentLoading();alert(e.message||'Action impossible')}}"
          if t.count(old)!=1:
              raise SystemExit(f'bloc buy introuvable: {t.count(old)}')
          t=t.replace(old,new,1)
          p.write_text(t)
          PY
      - name: Verification
        run: grep -F "verify-professional" pro-fondateur.html
      - name: Commit et nettoyage
        run: |
          rm .github/workflows/fix-pro-verification-once.yml
          git config user.name "Abracadeal Bot"
          git config user.email "abracadeal@gmail.com"
          git add pro-fondateur.html .github/workflows/fix-pro-verification-once.yml
          git commit -m "Verifie automatiquement le SIRET avant abonnement Pro"
          git push origin main
