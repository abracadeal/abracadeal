name: Corriger retour page Pro

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-pro-return-loop-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Corriger boucle retour Pro
        run: |
          python - <<'PY'
          from pathlib import Path

          app=Path('assets/index-app.js')
          t=app.read_text()
          old="""  async function ensureProPlanSelection(){
    if(!sb||!currentUser||currentProfile?.account_type!=='professionnel'||currentProfile?.is_admin===true)return false;"""
          new="""  async function ensureProPlanSelection(){
    try{
      const qs=new URLSearchParams(location.search);
      if(qs.get('pro_return')==='1'){
        sessionStorage.setItem('abraca_pro_plan_deferred','1');
        qs.delete('pro_return');
        history.replaceState(null,'',location.pathname+(qs.toString()?'?'+qs.toString():'')+location.hash);
      }
      if(sessionStorage.getItem('abraca_pro_plan_deferred')==='1')return false;
    }catch(_){}
    if(!sb||!currentUser||currentProfile?.account_type!=='professionnel'||currentProfile?.is_admin===true)return false;"""
          if t.count(old)!=1:
              raise SystemExit('ensureProPlanSelection introuvable')
          t=t.replace(old,new,1)
          t=t.replace("try{sessionStorage.removeItem('abraca_pro_plan_pending')}catch(_){}","try{sessionStorage.removeItem('abraca_pro_plan_pending');sessionStorage.removeItem('abraca_pro_plan_deferred')}catch(_){}",1)
          app.write_text(t)

          pro=Path('pro-fondateur.html')
          p=pro.read_text()
          oldlink='<a href="index.html">← Retour</a>'
          newlink='<a href="index.html?pro_return=1">← Retour</a>'
          if p.count(oldlink)!=1:
              raise SystemExit('lien retour introuvable')
          pro.write_text(p.replace(oldlink,newlink,1))
          PY
      - name: Verification
        run: |
          grep -F "abraca_pro_plan_deferred" assets/index-app.js
          grep -F 'index.html?pro_return=1' pro-fondateur.html
      - name: Commit et nettoyage
        run: |
          rm .github/workflows/fix-pro-return-loop-once.yml
          git config user.name "Abracadeal Bot"
          git config user.email "abracadeal@gmail.com"
          git add assets/index-app.js pro-fondateur.html .github/workflows/fix-pro-return-loop-once.yml
          git commit -m "Corrige boucle de retour depuis la page Pro"
          git push origin main
