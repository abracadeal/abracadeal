name: LOA garage preview
on:
  push:
    paths:
      - '.github/workflows/loa-garage-publish.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply LOA and garage patch
        run: python .github/loa_garage_patch.py
      - name: Validate visible changes
        run: |
          grep -q "LOA dès" index.html
          grep -q "Voir le garage et les avis" index.html
          grep -q "seller-quick-stats" index.html
      - name: Commit update
        run: |
          git config user.name "Abracadeal Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/loa_garage_patch.py .github/workflows/loa-garage-publish.yml
          git commit -m "Publish LOA and garage card preview"
          git push
