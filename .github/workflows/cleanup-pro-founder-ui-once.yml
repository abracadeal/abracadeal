name: Nettoyage page Pro Fondateurs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/cleanup-pro-founder-ui-once.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nettoyer la grille Fondateurs
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('pro-fondateur.html')
          s=p.read_text()
          old='<section class="group"><h3>Options de visibilité</h3><div id="boostWallet" class="wallet hidden"></div><div id="optionGrid" class="grid"></div></section>'
          if old in s:
              s=s.replace(old,'',1)
          marker='</script>'
          patch=r'''
<script>
(function(){
  function cleanFounderPricingUI(){
    document.querySelectorAll('#pricingGroups .offer').forEach(function(card){
      var t=(card.textContent||'').replace(/\s+/g,' ').trim();
      if((t.includes('1 annonce') && t.includes('24,99')) || t.includes('Auto / Moto / Immobilier — 1 annonce')) card.remove();
    });
  }
  var root=document.getElementById('pricingGroups');
  if(root){
    new MutationObserver(cleanFounderPricingUI).observe(root,{childList:true,subtree:true});
    cleanFounderPricingUI();
  }
})();
</script>
'''
          if 'cleanFounderPricingUI' not in s:
              s=s.replace('</body>',patch+'</body>',1)
          p.write_text(s)
          PY
          git rm .github/workflows/cleanup-pro-founder-ui-once.yml
          git add pro-fondateur.html
          git config user.name "abracadeal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Simplifie la page des offres Pro"
          git pull --rebase origin main
          git push origin main
