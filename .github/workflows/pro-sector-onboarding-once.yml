name: Domaine Pro et packs par categorie

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pro-sector-onboarding-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Appliquer les correctifs domaine Pro
        run: |
          python - <<'PY'
          from pathlib import Path

          def one(text, old, new, label):
              n=text.count(old)
              if n!=1:
                  raise SystemExit(f'{label}: attendu 1 occurrence, trouve {n}')
              return text.replace(old,new,1)

          html=Path('index.html')
          t=html.read_text()
          old='<div class="form-row full"><label for="signupCompany">Raison sociale</label><input class="input" id="signupCompany" required maxlength="160" autocomplete="organization"></div>'
          new=old+'\n <div class="form-row full"><label for="signupSector">Domaine professionnel</label><select class="select" id="signupSector" required><option value="">Choisir mon domaine</option><option value="vehicules">Véhicules — Auto & Moto</option><option value="immobilier">Immobilier</option><option value="hightech">High-tech</option><option value="maison">Maison & Déco</option><option value="mode">Mode</option><option value="emploi">Emploi</option><option value="services">Services & Artisans</option></select><small class="note">Votre pack couvrira uniquement ce domaine. Les autres catégories restent accessibles via une annonce à l’unité.</small></div>'
          t=one(t,old,new,'champ domaine Pro')
          html.write_text(t)

          main=Path('assets/index-main.js')
          t=main.read_text()
          t=one(t,"const signupDraftIds=['signupName','signupEmail','signupPhone','signupType','signupCompany','signupSiret','signupVatStatus','signupVat'];","const signupDraftIds=['signupName','signupEmail','signupPhone','signupType','signupCompany','signupSector','signupSiret','signupVatStatus','signupVat'];",'brouillon domaine')
          old="  const name=$('#signupName').value.trim(), type=$('#signupType').value;\n  const rawPhone=$('#signupPhone').value.trim();"
          new="  const name=$('#signupName').value.trim(), type=$('#signupType').value;\n  const proSector=type==='professionnel'?String($('#signupSector')?.value||'').trim():'';\n  if(type==='professionnel'&&!proSector){status.textContent='Choisis ton domaine professionnel.';return;}\n  const rawPhone=$('#signupPhone').value.trim();"
          t=one(t,old,new,'validation domaine')
          old="options:{emailRedirectTo:'https://abracadeal.fr/',data:{...legalAcceptance,display_name:name,account_type:type,phone,...(company_registration?{company_registration}:{})}}"
          new="options:{emailRedirectTo:'https://abracadeal.fr/',data:{...legalAcceptance,display_name:name,account_type:type,phone,pro_sector:proSector||null,...(company_registration?{company_registration}:{})}}"
          t=one(t,old,new,'metadata domaine')
          main.write_text(t)

          app=Path('assets/index-app.js')
          t=app.read_text()
          old="    const active=!!data&&['active','trialing'].includes(String(data.status||'').toLowerCase());\n    if(active){"
          new="    const active=!!data&&['active','trialing'].includes(String(data.status||'').toLowerCase());\n    let hasSingleCredit=false;\n    if(!active){\n      const {data:wallet,error:walletError}=await sb.from('pro_listing_credit_wallet').select('credits').eq('user_id',currentUser.id).gt('credits',0).limit(1);\n      if(walletError)console.warn('Vérification crédit annonce Pro indisponible',walletError);\n      else hasSingleCredit=Array.isArray(wallet)&&wallet.some(row=>Number(row?.credits||0)>0);\n    }\n    if(active||hasSingleCredit){"
          t=one(t,old,new,'credit annonce simple')
          app.write_text(t)

          pro=Path('pro-fondateur.html')
          t=pro.read_text()
          t=one(t,"select('account_type,is_admin')","select('account_type,is_admin,pro_sector')",'profil secteur grille')
          t=one(t,"mySectorGroup=profile?.is_admin?null:(SECTOR_GROUP[String(verif?.business_sector||'')]||null)","mySectorGroup=profile?.is_admin?null:(SECTOR_GROUP[String(profile?.pro_sector||'')]||null)",'filtre grille secteur')
          pro.write_text(t)

          fn=Path('supabase/functions/create-pro-subscription-order/index.ts')
          t=fn.read_text()
          t=one(t,'admin.from("profiles").select("account_type")','admin.from("profiles").select("account_type,pro_sector")','profil checkout')
          old=" if(plan.offer_group===\"auto_moto_immo\"&&!['vehicules','immobilier'].includes(String(verification.business_sector||'')))return json({error:\"Cette formule est réservée aux professionnels Auto, Moto et Immobilier.\"},403);"
          new=" const declaredSector=String(profile?.pro_sector||'');if(!declaredSector)return json({error:\"Choisissez votre domaine professionnel avant de sélectionner une formule.\"},403);if(plan.offer_group===\"auto_moto_immo\"&&!['vehicules','immobilier'].includes(declaredSector))return json({error:\"Cette formule ne correspond pas à votre domaine professionnel.\"},403);if(plan.offer_group!==\"auto_moto_immo\"&&plan.offer_group!==declaredSector)return json({error:\"Cette formule ne correspond pas à votre domaine professionnel.\"},403);"
          t=one(t,old,new,'controle checkout secteur')
          fn.write_text(t)
          PY

      - name: Verifications
        run: |
          grep -F 'id="signupSector"' index.html
          grep -F 'pro_sector:proSector||null' assets/index-main.js
          grep -F 'hasSingleCredit' assets/index-app.js
          grep -F "profile?.pro_sector" pro-fondateur.html
          grep -F 'account_type,pro_sector' supabase/functions/create-pro-subscription-order/index.ts

      - name: Commit et nettoyage
        run: |
          rm .github/workflows/pro-sector-onboarding-once.yml
          rm -f .github/workflows/allow-pro-single-credit-once.yml
          git config user.name "Abracadeal Bot"
          git config user.email "abracadeal@gmail.com"
          git add index.html assets/index-main.js assets/index-app.js pro-fondateur.html supabase/functions/create-pro-subscription-order/index.ts .github/workflows
          git diff --cached --quiet && exit 0
          git commit -m "Ajoute domaine Pro et limite les packs a la categorie choisie"
          git push origin main
