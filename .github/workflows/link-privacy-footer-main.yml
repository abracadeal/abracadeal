name: Link privacy footer on main
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/link-privacy-footer-main.yml'
permissions:
  contents: write
jobs:
  patch-footer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update privacy footer link
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<a href="#privacyModal" data-info-modal="privacyModal">Confidentialité</a>'
          new = '<a href="confidentialite.html">Confidentialité</a>'
          if new in s:
              print('Privacy link already updated.')
          elif old in s:
              p.write_text(s.replace(old, new, 1))
              print('Privacy link updated.')
          else:
              raise SystemExit('Expected privacy footer link not found')
          PY
      - name: Commit change and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/link-privacy-footer-main.yml
          git add index.html
          git commit -m "Link privacy policy from footer" || exit 0
          git push
