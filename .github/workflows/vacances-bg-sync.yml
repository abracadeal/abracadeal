name: Vacances background sync

on:
  push:
    paths:
      - '.github/workflows/vacances-bg-sync.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match Vacances background to main site
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/vacances-ui.css')
          s=p.read_text()
          marker='/* VACANCES_BG_MATCH_MAIN_20261005 */'
          if marker not in s:
              s += '''\n\n/* VACANCES_BG_MATCH_MAIN_20261005 */\n:root{--paper:#faf7fd}\nbody,#vacTravelerMain{background:#faf7fd!important}\n#vacTravelerMain .section,#vacTravelerMain .section.alt,#vacTravelerMain .owner{background:#faf7fd!important}\n@media(max-width:760px){\n  body,#vacTravelerMain{background:#faf7fd!important}\n  #vacTravelerMain .hero{background:transparent!important}\n}\n'''
              p.write_text(s)
          PY
      - name: Commit change
        shell: bash
        run: |
          git config user.name 'abracadeal'
          git config user.email 'abracadeal@gmail.com'
          git add assets/vacances-ui.css
          git diff --cached --quiet || git commit -m 'Aligne le fond Vacances sur le site principal'
          git push
