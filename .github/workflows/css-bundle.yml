# 08/11/2026 (Claude, vitesse du site) : à chaque modification d'un style, reconstruit assets/abraca-head.min.css
# (toutes les feuilles de l'en-tête d'index.html regroupées en un seul fichier, dans le même ordre). Voir scripts/build_css_bundle.py.
name: Styles regroupés (vitesse)

on:
  push:
    branches: [main]
    paths: ["index.html", "assets/**.css", "scripts/build_css_bundle.py", ".github/workflows/css-bundle.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: css-bundle
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install rcssmin==1.3.0
      - run: python scripts/build_css_bundle.py
      - name: Publier si le fichier regroupé a changé
        run: |
          git add index.html assets/abraca-head.min.css
          if git diff --cached --quiet; then echo "Aucun changement"; exit 0; fi
          git config user.name "abracadeal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Styles regroupés : mise a jour automatique"
          for i in 1 2 3; do
            if git pull --rebase -q origin main && git push -q origin main; then exit 0; fi
            sleep 5
          done
          exit 1
