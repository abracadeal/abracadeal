name: Corriger grille Pro bloquee Fondateurs

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-pro-pricing-sector-gate-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Corriger pro-fondateur
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('pro-fondateur.html')
          t=p.read_text()
          marker="async function init(){const {data:{session}}=await sb.auth.getSession();"
          if marker not in t:
              raise SystemExit('init introuvable')
          helper=r'''const SECTOR_LABELS={vehicules:'Véhicules — Auto & Moto',immobilier:'Immobilier',hightech:'High-tech',maison:'Maison & Déco',mode:'Mode',emploi:'Emploi',services:'Services & Artisans',vacances:'Vacances / Conciergerie'};
function adaptSectorPage(sector){const founderSector=['vehicules','immobilier'].includes(String(sector||''));const hero=document.querySelector('.hero'),founder=document.querySelector('.founder'),fp=document.querySelector('.founder-private');if(founderSector){founder?.classList.remove('hidden');fp?.classList.remove('hidden');return}founder?.classList.add('hidden');fp?.classList.add('hidden');if(hero){const pill=hero.querySelector('.pill'),h1=hero.querySelector('h1'),para=hero.querySelector('p');if(pill)pill.textContent='Espace Pro · '+(SECTOR_LABELS[sector]||sector);if(h1)h1.textContent='Choisissez la formule adaptée à votre activité';if(para)para.innerHTML='Votre abonnement Abracadeal couvre le domaine <strong>'+esc(SECTOR_LABELS[sector]||sector)+'</strong>. Les autres catégories restent accessibles via une annonce à l’unité.'}}
function showSectorChoice(userId){document.querySelector('.founder')?.classList.add('hidden');document.querySelector('.founder-private')?.classList.add('hidden');const hero=document.querySelector('.hero');if(hero){const pill=hero.querySelector('.pill'),h1=hero.querySelector('h1'),para=hero.querySelector('p');if(pill)pill.textContent='Configuration de votre compte Pro';if(h1)h1.textContent='Choisissez votre domaine professionnel';if(para)para.textContent='Ce choix détermine les packs et tarifs affichés pour votre activité. Auto et Moto sont regroupés dans le domaine Véhicules.'}const status=document.getElementById('pricingStatus');document.getElementById('pricingGroups').innerHTML='';document.getElementById('optionGrid')?.closest('.group')?.classList.add('hidden');status.classList.remove('hidden');status.innerHTML='<strong>Votre domaine principal</strong><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px"><select id="missingProSector" style="min-height:44px;border:1px solid #d9c9df;border-radius:10px;padding:0 12px"><option value="">Choisir mon domaine</option><option value="vehicules">Véhicules — Auto & Moto</option><option value="immobilier">Immobilier</option><option value="hightech">High-tech</option><option value="maison">Maison & Déco</option><option value="mode">Mode</option><option value="emploi">Emploi</option><option value="services">Services & Artisans</option></select><button id="saveMissingProSector" class="btn" type="button">Continuer</button></div><div class="note" style="margin-top:10px">Votre pack sera réservé à ce domaine. Une publication dans un autre domaine restera possible via l’annonce simple payante.</div>';document.getElementById('saveMissingProSector').onclick=async()=>{const sector=String(document.getElementById('missingProSector').value||'');if(!sector){alert('Choisissez votre domaine professionnel.');return}const btn=document.getElementById('saveMissingProSector');btn.disabled=true;btn.textContent='Enregistrement…';const {error}=await sb.from('profiles').update({pro_sector:sector}).eq('id',userId);if(error){btn.disabled=false;btn.textContent='Continuer';alert('Impossible d’enregistrer le domaine. Réessayez.');return}location.reload()}}
'''
          t=t.replace(marker,helper+marker,1)
          old="mySectorGroup=profile?.is_admin?null:(SECTOR_GROUP[String(profile?.pro_sector||'')]||null);if(profile?.account_type!=='professionnel'){document.getElementById('notPro').classList.remove('hidden');return}document.getElementById('privatePricing').classList.remove('hidden');"
          new="mySectorGroup=profile?.is_admin?null:(SECTOR_GROUP[String(profile?.pro_sector||'')]||null);if(profile?.account_type!=='professionnel'){document.getElementById('notPro').classList.remove('hidden');return}document.getElementById('privatePricing').classList.remove('hidden');if(!profile?.is_admin&&!profile?.pro_sector){showSectorChoice(session.user.id);return}adaptSectorPage(profile?.pro_sector);"
          if old not in t:
              raise SystemExit('bloc profil introuvable')
          t=t.replace(old,new,1)
          p.write_text(t)
          PY
      - name: Verification
        run: |
          grep -F "showSectorChoice" pro-fondateur.html
          grep -F "adaptSectorPage" pro-fondateur.html
      - name: Commit et nettoyage
        run: |
          rm .github/workflows/fix-pro-pricing-sector-gate-once.yml
          git config user.name "Abracadeal Bot"
          git config user.email "abracadeal@gmail.com"
          git add pro-fondateur.html .github/workflows/fix-pro-pricing-sector-gate-once.yml
          git commit -m "Corrige grille Pro selon le domaine choisi"
          git push origin main
