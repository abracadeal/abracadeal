name: Repair Abracadeal top navigation
on:
  push:
    paths:
      - '.github/workflows/repair-top-nav.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          css='''<style id="abraca-home-ux-patch">
          .abraca-account-menu{display:inline-flex!important;align-items:center!important}
          .abraca-account-trigger{
            min-height:48px!important;padding:0 22px!important;border-radius:16px!important;
            border:1px solid rgba(246,199,92,.95)!important;
            background:linear-gradient(135deg,#5b176f 0%,#9b279f 48%,#ec3fa4 100%)!important;
            color:#fff!important;font:inherit!important;font-weight:900!important;cursor:pointer!important;
            box-shadow:0 10px 28px rgba(210,55,173,.40),0 0 16px rgba(241,191,95,.22),inset 0 1px 0 rgba(255,255,255,.20)!important;
            text-shadow:0 1px 0 rgba(0,0,0,.18)!important;
          }
          .abraca-host-top{
            display:inline-flex!important;align-items:center!important;justify-content:center!important;
            min-height:48px!important;padding:0 20px!important;border-radius:16px!important;
            border:1px solid rgba(255,255,255,.16)!important;
            background:linear-gradient(135deg,#9b2bc0 0%,#ec3fa4 100%)!important;
            color:#fff!important;font-weight:900!important;text-decoration:none!important;
            box-shadow:0 9px 22px rgba(154,43,192,.28)!important;
          }
          @media(max-width:760px){
            .abraca-account-trigger,.abraca-host-top{min-height:42px!important;padding:0 13px!important;font-size:.82rem!important}
          }
          </style>'''

          js=r'''<script id="abraca-home-ux-script">
          document.addEventListener('DOMContentLoaded',()=>{
            const all=[...document.querySelectorAll('a,button,div,span,strong,p,h1,h2,h3')];
            const exact=t=>all.filter(el=>(el.textContent||'').trim()===t);
            const visible=el=>!!(el.offsetWidth||el.offsetHeight||el.getClientRects().length);

            // MAIN NAV: preserve the original account actions as hidden triggers.
            const publish=exact('Publier une annonce').find(visible);
            if(publish&&publish.parentElement){
              const parent=publish.parentElement;
              const createOriginal=exact('Créer un compte').find(el=>parent.contains(el)) || exact('Créer un compte').find(visible);
              const loginOriginal=exact('Se connecter').find(el=>parent.contains(el)) || exact('Se connecter').find(visible);

              // Remove old injected controls / duplicate Vacances buttons in this nav only.
              [...parent.children].forEach(el=>{
                if(el===publish) return;
                const t=(el.textContent||'').trim().toLowerCase();
                if(el.classList.contains('abraca-account-menu') ||
                   el.classList.contains('abraca-vacances-top') ||
                   el.classList.contains('abraca-host-top') ||
                   t==='vacances' || t==='devenir hôte' || t==='devenir hote' ||
                   t==='compte'){
                  el.remove();
                }
              });

              if(createOriginal) createOriginal.style.display='none';
              if(loginOriginal) loginOriginal.style.display='none';

              const accountWrap=document.createElement('div');
              accountWrap.className='abraca-account-menu';
              const account=document.createElement('button');
              account.type='button';
              account.className='abraca-account-trigger';
              account.textContent='Compte';
              account.addEventListener('click',e=>{
                e.preventDefault();
                try{ history.replaceState(null,'','#accountModal'); }catch(_){}
                if(createOriginal){
                  try{ createOriginal.click(); }catch(_){}
                } else if(loginOriginal){
                  try{ loginOriginal.click(); }catch(_){}
                }
                const modal=document.getElementById('accountModal');
                if(modal){
                  modal.removeAttribute('hidden');
                  modal.setAttribute('aria-hidden','false');
                  modal.classList.add('show','open','active');
                  if(getComputedStyle(modal).display==='none') modal.style.display='flex';
                }
              });
              accountWrap.append(account);

              const host=document.createElement('a');
              host.href='espace-hote.html';
              host.className='abraca-host-top';
              host.textContent='Devenir hôte';

              parent.insertBefore(accountWrap,publish);
              parent.insertBefore(host,publish);
            }

            // Founder banner: keep the simplified presentation already chosen.
            ['1re année','2e année','Ensuite','Sans engagement','Sans engagement automatique'].forEach(label=>{
              for(const el of exact(label)){
                let box=el;
                for(let i=0;i<4&&box.parentElement;i++){
                  const parent=box.parentElement;
                  const txt=(parent.innerText||'').trim();
                  if(txt.length<260){box=parent}else break;
                }
                if(box && box!==document.body) box.style.display='none';
              }
            });
            for(const el of all){
              const t=(el.textContent||'').trim();
              if((t.includes('-10 % la 2e année')||t.includes('–10 % la 2e année')||t.includes('Puis tarif public en vigueur')||t.includes('Sans engagement automatique'))&&t.length<90){
                el.style.display='none';
              }
            }

            // Pro/Pro CTA on the right.
            const pro=exact('Découvrez Pro/Pro').find(visible);
            const proBtn=all.find(el=>(el.textContent||'').trim().startsWith('Un espace dédié aux pros')&&visible(el));
            if(pro&&proBtn){
              let container=pro.parentElement;
              for(let i=0;i<4&&container;i++){
                if(container.contains(proBtn)) break;
                container=container.parentElement;
              }
              if(container){
                container.style.display='grid';
                container.style.gridTemplateColumns='minmax(0,1fr) auto';
                container.style.alignItems='center';
                container.style.gap='18px';
                proBtn.style.justifySelf='end';
              }
            }
          });
          </script>'''

          if 'id="abraca-home-ux-patch"' in s:
            s=re.sub(r'<style id="abraca-home-ux-patch">[\s\S]*?</style>',css,s,count=1)
          else:
            s=s.replace("</head>",css+"</head>")

          if 'id="abraca-home-ux-script"' in s:
            s=re.sub(r'<script id="abraca-home-ux-script">[\s\S]*?</script>',js,s,count=1)
          else:
            s=s.replace("</body>",js+"</body>")

          p.write_text(s,encoding="utf-8")
          PY
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "Abracadeal Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Repair premium account and host buttons"
          git push
