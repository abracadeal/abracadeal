<body>
<header class="top"><div class="topin"><a class="brand" href="index.html">Abracadeal</a><a class="back" href="index.html#resultats">← Retour aux annonces</a></div></header>
<main class="wrap"><div id="app"><div class="card"><div class="empty">Chargement du showroom…</div></div></div></main>
<script>
const SUPABASE_URL='https://jplzvxmpbpjssyinozap.supabase.co';
const SUPABASE_KEY='sb_publishable_lUCkpzyw0kQCs9AWraNjzw_2CoT0JeF';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const id=new URLSearchParams(location.search).get('id');
const app=document.getElementById('app');
let profile=null,showroom=null,listings=[],reviews=[],filtered=[],shown=24,currentUser=null,isFollowing=false,followerCount=0,proContact={email:'',phone:''};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const money=v=>v===null||v===''?'Prix non renseigné':Number(v).toLocaleString('fr-FR')+' €';
const showroomUrl=path=>path?sb.storage.from('pro-showroom').getPublicUrl(path).data?.publicUrl||'':'';
const photoUrl=path=>!path?'':/^https?:\/\//i.test(String(path))?String(path):sb.storage.from('listing-images').getPublicUrl(path).data?.publicUrl||'';/* 02/11/2026 : photos d'annonces importées affichées depuis le site du pro */
const initials=name=>String(name||'PRO').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()||'PRO';
const catLabel=v=>({vehicules:'Auto / Moto',immobilier:'Immobilier',vacances:'Vacances',hightech:'High-tech',maison:'Maison',mode:'Mode',emploi:'Emploi',services:'Services',autres:'Autres'})[v]||v||'Autres';

function fail(){
  document.title='Showroom introuvable · Abracadeal';
  app.innerHTML='<div class="error"><h1>Showroom introuvable</h1><p>Ce profil professionnel n’existe pas ou n’est plus disponible.</p><a href="index.html">Retour à l’accueil Abracadeal</a></div>';
}
function rating(){
  if(!reviews.length)return {avg:0,label:'Aucun avis'};
  const avg=reviews.reduce((s,r)=>s+Number(r.rating||0),0)/reviews.length;
  return {avg,label:avg.toFixed(1).replace('.',',')+' / 5 · '+reviews.length+' avis'};
}
function firstPhoto(l){
  const photos=[...(l.listing_photos||[])].sort((a,b)=>Number(a.position)-Number(b.position));
  return photos[0]?.storage_path||'';
}
function renderShell(){
  const isOwner=!!currentUser&&currentUser.id===id;
  const r=rating(),banner=showroomUrl(showroom?.banner_path),logo=showroomUrl(showroom?.logo_path);
  document.title=(profile.display_name||'Professionnel')+' · Showroom Abracadeal';
  app.innerHTML='<div class="card">'+
    '<div class="banner"'+(banner?' style="background-image:url(&quot;'+esc(banner)+'&quot;)"':'')+'></div>'+
    '<div class="identity"><div class="logo"'+(logo?' style="background-image:url(&quot;'+esc(logo)+'&quot;)"':'')+'>'+(logo?'':esc(initials(profile.display_name)))+'</div>'+
    '<div><div class="name">'+esc(profile.display_name||'Professionnel Abracadeal')+'</div><div class="meta"><span class="badge">✓ Professionnel</span>'+(profile.city?'<span>'+esc(profile.city)+'</span>':'')+(r.avg?'<span>★ '+esc(r.label)+'</span>':'')+(showroom?.slug?'<span>abracadeal.fr/'+esc(showroom.slug)+'</span>':'')+'<span id="followersCount">'+(followerCount?followerCount+' abonné'+(followerCount>1?'s':''):'')+'</span></div></div>'+
    /* 02/11/2026 (Anthony) : le pro qui regarde sa propre page ne peut pas s'abonner ni se contacter lui-même */
    (isOwner
      ?'<div class="identity-actions"><a class="follow" id="editPageBtn" href="/?espace=pro" style="text-decoration:none;text-align:center">Modifier ma page</a><button class="share" id="shareBtn" type="button">Partager</button></div></div><div class="owner-note">C’est votre page : vos clients la voient exactement comme ça.</div>'
      :'<div class="identity-actions"><button class="follow'+(isFollowing?' following':'')+'" id="followBtn" type="button">'+(isFollowing?'✓ Abonné':'♡ S’abonner')+'</button><button class="contact-toggle" id="contactBtn" type="button">Contacter</button><button class="share" id="shareBtn" type="button">Partager</button></div></div>')+
    '<div class="contact-box hidden" id="contactBox"><strong>Contacter ce professionnel</strong>'+(proContact.email?'<a class="contact-link" href="mailto:'+esc(proContact.email)+'">✉ E-mail</a>':'')+(proContact.phone?'<a class="contact-link" href="tel:'+esc(proContact.phone.replace(/\s+/g,''))+'">☎ '+esc(proContact.phone)+'</a>':'')+(!currentUser?'<span class="muted">Coordonnées réservées aux membres. L’inscription est gratuite.</span><a class="contact-link" href="#" data-gate="inscription">Créer un compte</a><a class="contact-link" href="#" data-gate="connexion">Se connecter</a>':(!proContact.email&&!proContact.phone?'<span class="muted">Coordonnées non renseignées.</span>':''))+'</div>'+
    '<nav class="tabs"><button class="active" data-tab="ads">Annonces ('+listings.length+')</button><button data-tab="about">À propos</button><button data-tab="reviews">Avis ('+reviews.length+')</button></nav>'+
    '<section class="pane" id="pane"></section></div>';
  document.getElementById('shareBtn').onclick=sharePage;
  if(document.getElementById('followBtn'))document.getElementById('followBtn').onclick=toggleFollow;
  if(document.getElementById('contactBtn'))document.getElementById('contactBtn').onclick=()=>document.getElementById('contactBox')?.classList.toggle('hidden');
  bindGate(document.getElementById('contactBox'));
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
  setTab('ads');
}
async function sharePage(){
  const link=showroom?.slug?'https://abracadeal.fr/'+showroom.slug:location.href;
  const data={title:document.title,text:'Découvrez ce showroom professionnel sur Abracadeal',url:link};
  try{if(navigator.share)await navigator.share(data);else{await navigator.clipboard.writeText(link);alert('Lien copié : '+link);}}catch(e){if(e?.name!=='AbortError')prompt('Copiez ce lien :',link);}
}

async function toggleFollow(){
  const btn=document.getElementById('followBtn');
  if(!currentUser){
    alert('Connectez-vous à Abracadeal pour vous abonner à ce professionnel.');
    location.href='index.html';
    return;
  }
  if(!btn)return;
  btn.disabled=true;
  try{
    if(isFollowing){
      const {error}=await sb.from('pro_followers').delete().eq('pro_id',id).eq('follower_id',currentUser.id);
      if(error)throw error;
      isFollowing=false;followerCount=Math.max(0,followerCount-1);
    }else{
      const {error}=await sb.from('pro_followers').insert({pro_id:id,follower_id:currentUser.id});
      if(error)throw error;
      isFollowing=true;followerCount+=1;
    }
    btn.classList.toggle('following',isFollowing);
    btn.textContent=isFollowing?'✓ Abonné':'♡ S’abonner';
    const count=document.getElementById('followersCount');
    if(count)count.textContent=followerCount?followerCount+' abonné'+(followerCount>1?'s':''):'';
  }catch(error){
    console.error(error);
    alert('Impossible de modifier votre abonnement pour le moment.');
  }finally{btn.disabled=false}
}
function setTab(tab){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  if(tab==='ads')renderAds();else if(tab==='about')renderAbout();else renderReviews();
}
/* 02/11/2026 (Anthony) : trop de filtres dans la vitrine — on garde seulement le tri par prix (croissant / décroissant).
   Par défaut : annonces les plus récentes d'abord. */
const nice=v=>{v=String(v||'').trim();return v?v.charAt(0).toUpperCase()+v.slice(1).toLowerCase():''};
const fmtN=n=>Number(n).toLocaleString('fr-FR');
let isVeh=false;
function applyFilters(){
  const sort=document.getElementById('stockSort')?.value||'';
  const num=(v,d)=>v==null||v===''?d:Number(v);
  filtered=[...listings].sort((a,b)=>sort==='price-asc'?num(a.price,Infinity)-num(b.price,Infinity):sort==='price-desc'?num(b.price,-Infinity)-num(a.price,-Infinity):new Date(b.created_at)-new Date(a.created_at));
  shown=24;renderCards();
}
function renderAds(){
  const pane=document.getElementById('pane');
  isVeh=listings.filter(l=>l.category==='vehicules').length>listings.length/2;
  const n=listings.length,label=(isVeh?'véhicule':'annonce')+(n>1?'s':'');
  pane.innerHTML=(n>1?'<div class="tools sortbar"><div class="count"><b>'+n+'</b> '+label+'</div><select id="stockSort" aria-label="Trier par prix"><option value="">Trier par prix</option><option value="price-asc">Prix croissant</option><option value="price-desc">Prix décroissant</option></select></div>':'')+'<div id="stockResults"></div>';
  document.getElementById('stockSort')?.addEventListener('change',applyFilters);
  applyFilters();
}
function bindGate(root){root?.querySelectorAll('[data-gate]').forEach(a=>a.onclick=e=>{e.preventDefault();location.href='/?compte='+a.dataset.gate+'&retour='+encodeURIComponent(location.pathname+location.search);});}
function renderCards(){
  const host=document.getElementById('stockResults');if(!host)return;
  if(!filtered.length){host.innerHTML='<div class="empty">Aucune annonce ne correspond à votre recherche.</div>';return}
  const cards=filtered.slice(0,shown).map(l=>{
    const photo=photoUrl(firstPhoto(l)),url='/?annonce='+encodeURIComponent(l.id)+'&retour='+encodeURIComponent(location.pathname+location.search);/* 02/11/2026 : fermer l'annonce ramène au showroom */
    return '<a class="ad" href="'+url+'"><div class="photo"'+(photo?' style="background-image:url(&quot;'+esc(photo)+'&quot;)"':'')+'></div><div class="adbody"><div class="adtitle">'+esc(l.category==='vehicules'&&window.displayVehicleTitle?window.displayVehicleTitle(l.title||'Annonce'):(l.title||'Annonce'))+'</div><div class="price">'+esc(money(l.price))+'</div>'+(l.category==='vehicules'&&(l.vehicle_year||l.mileage!=null||l.fuel)?'<div class="specs">'+esc([l.vehicle_year,l.mileage!=null?fmtN(l.mileage)+' km':'',nice(l.fuel),nice(l.transmission)].filter(Boolean).join(' · '))+'</div>':'')+'<div class="city">'+esc(l.city||'')+'</div></div></a>';
  }).join('');
  host.innerHTML='<div class="grid">'+cards+'</div>'+(shown<filtered.length?'<button class="more" id="moreBtn" type="button">Voir plus</button>':'');
  document.getElementById('moreBtn')?.addEventListener('click',()=>{shown+=24;renderCards()});
}
function renderAbout(){
  const pane=document.getElementById('pane'),cats=[...new Set(listings.map(l=>catLabel(l.category)).filter(Boolean))];
  pane.innerHTML='<div class="about"><div class="box"><h3>À propos</h3><p>'+(showroom?.description?esc(showroom.description).replace(/\n/g,'<br>'):'Ce professionnel n’a pas encore ajouté de présentation.')+'</p></div><div class="box"><h3>Informations</h3><div class="facts"><div class="fact"><span>Ville</span><strong>'+esc(profile.city||'—')+'</strong></div><div class="fact"><span>Membre depuis</span><strong>'+esc(profile.joined_at?new Date(profile.joined_at).toLocaleDateString('fr-FR',{month:'long',year:'numeric'}):'—')+'</strong></div><div class="fact"><span>Annonces</span><strong>'+listings.length+'</strong></div><div><span class="muted">Catégories</span><p>'+esc(cats.join(', ')||'—')+'</p></div></div></div></div>';
}
function renderReviews(){
  const pane=document.getElementById('pane');if(!reviews.length){pane.innerHTML='<div class="empty">Aucun avis pour le moment.</div>';return}
  pane.innerHTML=reviews.map(r=>'<article class="review"><div><span class="stars">'+'★'.repeat(Number(r.rating||0))+'☆'.repeat(5-Number(r.rating||0))+'</span> <strong>'+Number(r.rating||0)+'/5</strong></div><p>'+esc(r.comment||'')+'</p><div class="muted">'+new Date(r.created_at).toLocaleDateString('fr-FR')+'</div></article>').join('');
}
async function init(){
  if(!id||!/^[0-9a-f-]{36}$/i.test(id)){fail();return}
  const [p,s,l,r]=await Promise.all([
    sb.from('public_profiles').select('id,display_name,account_type,city,joined_at').eq('id',id).maybeSingle(),
    sb.from('pro_showrooms').select('description,banner_path,logo_path,updated_at,slug').eq('user_id',id).maybeSingle(),
    sb.from('listings').select('id,title,price,city,category,created_at,vehicle_make,vehicle_year,mileage,fuel,transmission,listing_photos(storage_path,position)').eq('owner_id',id).eq('status','active').eq('visibility_scope','public').order('created_at',{ascending:false}),
    sb.from('reviews').select('rating,comment,created_at').eq('seller_id',id).eq('status','active').order('created_at',{ascending:false})
  ]);
  if(p.error||!p.data||p.data.account_type!=='professionnel'){fail();return}
  profile=p.data;showroom=s.data||{};listings=l.data||[];reviews=r.data||[];
  const [{data:sessionData},{count:followersTotal},{data:contactRows}]=await Promise.all([
    sb.auth.getSession(),
    sb.from('pro_followers').select('*',{count:'exact',head:true}).eq('pro_id',id),
    sb.rpc('get_public_pro_contact',{p_user_id:id})
  ]);
  currentUser=sessionData?.session?.user||null;
  followerCount=Number(followersTotal||0);
  proContact=contactRows?.[0]||{email:'',phone:''};
  if(currentUser){
    const {data:followRow}=await sb.from('pro_followers').select('pro_id').eq('pro_id',id).eq('follower_id',currentUser.id).maybeSingle();
    isFollowing=!!followRow;
  }
  renderShell();
  // 02/11/2026 (Anthony : « un passage sur la page d'accueil quand on clique sur une annonce ») : la fiche s'ouvre par-dessus
// le showroom, dans une fenêtre intégrée (accueil caché). Clic molette / Ctrl / Cmd : nouvel onglet comme avant.
(function(){
  // 02/11/2026 (Anthony : « ça met du temps ») : une fiche est préchargée en arrière-plan (/?embed=1, sans catalogue) ;
  // au clic, on lui demande d'ouvrir l'annonce → affichage immédiat. Si elle n'est pas encore prête : ancienne méthode.
  let wrap=null,opened=false,pre=null,preReady=false,usingPre=false;
  const LOADING='<div class="adf-loading" style="position:absolute;inset:0;display:grid;place-items:center;color:#fff;font:600 14px system-ui">Chargement de l’annonce…</div>';
  function preload(){
    if(pre)return;
    pre=document.createElement('div');pre.id='adFramePre';
    pre.style.cssText='position:fixed;inset:0;z-index:2147483600;background:rgba(10,4,18,.55);display:none';
    const f=document.createElement('iframe');f.src='/?embed=1';f.title='Annonce';f.setAttribute('allowtransparency','true');f.setAttribute('aria-hidden','true');
    f.style.cssText='position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;opacity:0;transition:opacity .15s';
    f.onload=()=>{preReady=true;};
    pre.appendChild(f);document.body.appendChild(pre);
  }
  function hidePre(){if(!pre)return;pre.style.display='none';const f=pre.querySelector('iframe');if(f){f.style.opacity='0';f.setAttribute('aria-hidden','true');}pre.querySelector('.adf-loading')?.remove();}
  function closeAd(fromHistory){
    if(!wrap&&!usingPre)return;
